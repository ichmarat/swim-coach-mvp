<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#081727"><title>Swim Coach v0.2</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071727;color:#f5f9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#063451 0%,#081727 42%,#061525 100%);min-height:100dvh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}.app{max-width:640px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 17px) 14px calc(env(safe-area-inset-bottom) + 26px)}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 22px}h1{font-size:clamp(25px,6vw,34px);margin:0;font-weight:750;letter-spacing:-.7px}.headActions{display:flex;gap:7px}.headBtn{background:#16344e;border:1px solid #527089;border-radius:13px;color:#f4f8fd;padding:11px 12px;font-weight:650;font-size:14px}.list{display:grid;gap:10px}.swimmer{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden;border-radius:19px}.swimmer.swim{background:linear-gradient(110deg,#075a44,#06432f)}.swimmer.rest{background:linear-gradient(110deg,#70541e,#4b3918)}.swimmer.ready{background:linear-gradient(110deg,#25445f,#1a3048)}.swimmer.dragging{opacity:.58;outline:2px dashed #bdd6ef}.swimmer-inner{display:flex;align-items:center;gap:10px;min-height:99px;padding:14px 12px 14px 17px;position:relative;z-index:1;transform:translateX(0);transition:transform .14s}.swimmer.reveal .swimmer-inner{transform:translateX(-105px)}.who{flex:1 1 auto;min-width:0}.name{font-size:clamp(23px,5.7vw,30px);font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.12}.history{font-size:16px;color:#c5d4dd;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:19px}.clock{font-size:clamp(23px,5.3vw,31px);font-weight:750;letter-spacing:-.8px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;margin-left:auto}.play{border:0;width:57px;height:57px;min-width:57px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#f6f7f8;box-shadow:0 2px 6px #0002}.play.stop{background:#f12a2f}.play svg{width:27px;height:27px}.skip{position:absolute;right:0;top:0;bottom:0;width:105px;background:#a74e27;transform:translateX(100%);border:0;color:white;font-size:15px;font-weight:750;z-index:0}.swimmer.reveal .skip{transform:translateX(0)}.swimmer.reveal{background:#243b50}.swimmer-inner{width:100%}.subtle{color:#a8bfd2;font-size:13px;line-height:1.5}.panel{background:#142b42;border:1px solid #31536c;border-radius:20px;padding:16px;margin-bottom:12px}.row{display:flex;align-items:center;gap:9px}.grow{flex:1;min-width:0}.field{min-width:0;width:100%;padding:14px 13px;border-radius:14px;border:1px solid #7890a2;background:#0d2338;color:white;font-size:17px}.primary{background:linear-gradient(#2485ff,#075de5);border:1px solid #58a4ff;color:#fff;border-radius:15px;padding:14px 17px;font-weight:750}.mutedBtn{background:#29425a;color:white;border:1px solid #45657e;border-radius:12px;padding:10px}.danger{color:#ffaaa7}.attendanceRow{display:flex;align-items:center;gap:13px;background:#19344c;border:1px solid #36546d;border-radius:15px;padding:15px;margin:8px 0;font-size:21px;font-weight:650;cursor:pointer}.attendanceRow input{width:24px;height:24px;accent-color:#2485ff;flex-shrink:0}.attendanceRow.checked{background:#194a43;border-color:#2d806c}.attendanceToolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.personEdit{display:flex;align-items:center;gap:10px;background:#18334d;border-radius:16px;padding:14px 12px;margin:9px 0;min-height:69px}.personEdit .nm{font-size:23px;font-weight:720;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.personEdit .small{border:0;background:#29445d;border-radius:50%;width:39px;height:39px;color:white;font-size:18px}.bottom{margin-top:22px;width:100%}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 13px;color:#c2d3e2}.resultsCard{border-radius:18px;background:#17334b;overflow:hidden;margin:9px 0;border:1px solid #30506b}.resultsTop{display:flex;gap:10px;align-items:center;padding:14px 15px;cursor:pointer}.resultsTop .left{flex:1;min-width:0}.resultsTop .nm{font-size:25px;font-weight:750}.resultsTop .marks{color:#bdcede;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.resultsTop .counts{text-align:right;white-space:nowrap}.resultsTop .counts b{font-size:17px}.resultsTop .counts small{display:block;color:#bdcede;margin-top:4px}.details{border-top:1px solid #466078;padding:13px 16px 16px}.splitRow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #36526b;padding:10px 2px;font-variant-numeric:tabular-nums}.splitRow.head{font-size:12px;color:#9eb7cb;font-weight:750}.splitRow.skiprow{color:#ffca6c}.avg{display:flex;justify-content:space-between;padding-top:15px;color:#c8d9e6}.avg b{color:#fff}.hint{margin:12px 4px;color:#9fb5c7;font-size:13px}.empty{text-align:center;padding:45px 12px;color:#a9bfd0}.footerActions{display:flex;gap:10px;margin-top:18px}.footerActions button{flex:1}.dragGhost{position:fixed;z-index:50;pointer-events:none;opacity:.95;box-shadow:0 10px 32px #0008;border-radius:19px;overflow:hidden}.smallHeading{font-weight:700;color:#d4e3ee;margin-bottom:9px}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e6f3ff;color:#10243b;border-radius:15px;padding:11px 16px;font-weight:650;z-index:100;white-space:nowrap;box-shadow:0 8px 24px #0006}.hidden{display:none!important}@media(max-width:440px){.swimmer-inner{gap:8px;padding-left:13px;padding-right:11px}.clock{font-size:clamp(22px,5.1vw,29px)}.play{width:52px;height:52px;min-width:52px}.name{font-size:clamp(21px,5.5vw,28px)}}@media(max-width:390px){.app{padding-left:9px;padding-right:9px}.swimmer-inner{gap:7px;padding-left:13px;padding-right:9px}.play{width:52px;height:52px;min-width:52px}.history{font-size:14px}.headBtn{padding:10px 9px;font-size:13px}}
</style></head><body><div class="app" id="app"></div><script>
(()=>{'use strict';const KEY='swim-coach-v02';const DEFAULT=['Анаят','Алена','Эмиль','Алексей','Сергей','Рустам','Николай','Аблай','Марат','Айнура Б.','Дина','Арман','Айнура К.','Татьяна','Асель','Ляззат','Камила','Елена','Марина'];let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!state||!Array.isArray(state.people)){state={people:DEFAULT.map((name,i)=>({id:'p'+i,name,events:[],mode:'ready',startedAt:null,restAt:null})),createdAt:Date.now()}}state.people=state.people.map(p=>({...p,events:Array.isArray(p.events)?p.events:[],mode:p.mode||'ready'}));if(!state.roster19Applied){const existing=[...state.people];const used=new Set();const ordered=DEFAULT.map((name,i)=>{const p=existing.find(x=>x.name===name&&!used.has(x.id));if(p){used.add(p.id);return p}return {id:'roster19-'+i,name,events:[],mode:'ready',startedAt:null,restAt:null}});state.people=[...ordered,...existing.filter(p=>!used.has(p.id))];state.roster19Applied=true;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}if(!Array.isArray(state.attending)){state.attending=state.people.filter(p=>p.events.length||p.mode==='swim'||p.mode==='rest').map(p=>p.id);state.attendanceChosen=false}state.attending=state.attending.filter(id=>state.people.some(p=>p.id===id));let page=state.attendanceChosen?'timer':'attendance',expanded=null,revealed=null,drag=null,toastTimer=null;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Не удалось сохранить данные')}};const fmt=ms=>{ms=Math.max(0,ms||0);const d=Math.floor(ms/100),m=Math.floor(d/600),s=Math.floor((d%600)/10),t=d%10;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${t}`};const splitFmt=ms=>fmt(ms).replace(/^0/,'');const marks=p=>p.events.map((e,i)=>e.type==='skip'?'–':String(i+1));const lastFive=p=>marks(p).slice(-5).join(', ');const count=p=>p.events.filter(e=>e.type==='finish').length;const avg=p=>{const a=p.events.filter(e=>e.type==='finish').map(e=>e.duration);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};const svg=(type)=>type==='stop'?'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="8" width="32" height="32" rx="3" fill="white"/></svg>':'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M11 6L41 24 11 42Z" fill="#101820"/></svg>';function notify(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2300)}function render(){if(page==='timer')renderTimer();else if(page==='attendance')renderAttendance();else if(page==='people')renderPeople();else renderResults()}
function renderAttendance(){app.innerHTML=`<header><h1 style="font-size:26px">Кто сегодня плавает?</h1><button class="headBtn" data-nav="people">Список</button></header><div class="panel"><div class="smallHeading">Участники тренировки</div><div class="subtle">Выберите присутствующих из постоянного списка. Порядок сохранится.</div><div class="attendanceToolbar"><span id="attCount">${state.attending.length} из ${state.people.length}</span><div class="row"><button class="mutedBtn" id="selectAll">Все</button><button class="mutedBtn" id="selectNone">Снять</button></div></div></div><div id="attendanceList">${state.people.map(p=>`<label class="attendanceRow ${state.attending.includes(p.id)?'checked':''}"><input type="checkbox" data-att="${esc(p.id)}" ${state.attending.includes(p.id)?'checked':''}><span>${esc(p.name)}</span></label>`).join('')}</div><button class="primary bottom" id="startWorkout">${state.attendanceChosen?'✓ К секундомеру':'▶ Начать тренировку'}</button>`;bindNav();const refresh=()=>{app.querySelector('#attCount').textContent=`${state.attending.length} из ${state.people.length}`;app.querySelectorAll('[data-att]').forEach(el=>{el.checked=state.attending.includes(el.dataset.att);el.closest('label').classList.toggle('checked',el.checked)})};app.querySelectorAll('[data-att]').forEach(el=>el.onchange=()=>{if(el.checked){if(!state.attending.includes(el.dataset.att))state.attending.push(el.dataset.att)}else state.attending=state.attending.filter(id=>id!==el.dataset.att);save();refresh()});app.querySelector('#selectAll').onclick=()=>{state.attending=state.people.map(p=>p.id);save();refresh()};app.querySelector('#selectNone').onclick=()=>{state.attending=[];save();refresh()};app.querySelector('#startWorkout').onclick=()=>{if(!state.attending.length)return notify('Выберите хотя бы одного пловца');state.attendanceChosen=true;save();page='timer';render()}}
function renderTimer(){const active=state.people.filter(p=>state.attending.includes(p.id));app.innerHTML=`<header><h1>Секундомер</h1><div class="headActions"><button class="headBtn" data-nav="attendance">Участники</button><button class="headBtn" data-nav="results">Результаты</button></div></header><div class="list" id="swimmers">${active.map(p=>`<div class="swimmer ${esc(p.mode)}" data-id="${esc(p.id)}"><button class="skip" data-skip="${esc(p.id)}">Пропуск</button><div class="swimmer-inner"><div class="who"><div class="name">${esc(p.name)}</div><div class="history">${esc(lastFive(p))||' '}</div></div><div class="clock" data-clock="${esc(p.id)}">${p.mode==='swim'?fmt(Date.now()-p.startedAt):p.mode==='rest'?fmt(Date.now()-p.restAt):'00:00.0'}</div><button class="play ${p.mode==='swim'?'stop':''}" data-toggle="${esc(p.id)}" aria-label="${p.mode==='swim'?'Финиш':'Старт'}: ${esc(p.name)}">${svg(p.mode==='swim'?'stop':'play')}</button></div></div>`).join('')}</div>${active.length?'':'<div class="empty">Выберите участников тренировки.</div>'}<div class="hint">Удерживайте плашку для перемещения · свайп влево для пропуска</div><div class="footerActions"><button class="mutedBtn" data-new>Новая тренировка</button></div>`;bindNav();app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));app.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>skip(b.dataset.skip));app.querySelector('[data-new]').onclick=newWorkout;setupGestures()}
function toggle(id){const p=state.people.find(x=>x.id===id);if(!p)return;const now=Date.now();if(p.mode==='swim'){const duration=Math.max(0,now-p.startedAt);p.events.push({type:'finish',duration,startedAt:p.startedAt,at:now,restBefore:p.restAt==null?null:Math.max(0,p.startedAt-p.restAt)});p.mode='rest';p.restAt=now;p.startedAt=null}else{p.mode='swim';p.startedAt=now}revealed=null;save();renderTimer()}function skip(id){const p=state.people.find(x=>x.id===id);if(!p)return;if(p.mode==='swim'){notify('Сначала завершите текущий отрезок');return}p.events.push({type:'skip',at:Date.now()});revealed=null;save();renderTimer()}function newWorkout(){if(!confirm('Начать новую тренировку? Текущие результаты будут очищены. Список пловцов сохранится. Сначала экспортируйте результаты, если они нужны.'))return;state.people.forEach(p=>{p.events=[];p.mode='ready';p.startedAt=null;p.restAt=null});state.createdAt=Date.now();state.attending=[];state.attendanceChosen=false;page='attendance';save();render();notify('Выберите участников новой тренировки')}function bindNav(){app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;revealed=null;render()})}function renderPeople(){app.innerHTML=`<header><button class="headBtn" data-nav="timer">‹ Назад</button><h1 style="font-size:25px">Список пловцов</h1><span style="width:52px"></span></header><div class="row" style="margin-bottom:20px"><input class="field grow" id="newPerson" placeholder="Имя пловца" maxlength="48" autocomplete="off"><button class="primary" id="addPerson">+ Добавить</button></div><div class="sectionHead"><b>Постоянный список</b><span>${state.people.length} чел.</span></div><div id="editList">${state.people.map(p=>`<div class="personEdit" data-person="${esc(p.id)}"><div class="nm">${esc(p.name)}</div><button class="small" data-edit="${esc(p.id)}" aria-label="Переименовать">✎</button><button class="small danger" data-delete="${esc(p.id)}" aria-label="Удалить">♜</button></div>`).join('')}</div><div class="hint">Удерживайте всю строку, чтобы изменить порядок</div><button class="primary bottom" id="done">✓ Готово</button>`;bindNav();const inp=app.querySelector('#newPerson');const add=()=>{const name=inp.value.trim();if(!name)return;state.people.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,5),name,events:[],mode:'ready',startedAt:null,restAt:null});save();renderPeople();app.querySelector('#newPerson').focus()};app.querySelector('#addPerson').onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()};app.querySelector('#done').onclick=()=>{page='attendance';render()};app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=state.people.find(x=>x.id===b.dataset.edit);const s=prompt('Имя пловца',p.name);if(s===null)return;if(!s.trim())return notify('Имя не может быть пустым');p.name=s.trim();save();renderPeople()});app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const p=state.people.find(x=>x.id===b.dataset.delete);if(!confirm(`Удалить ${p.name}${p.events.length?' вместе с результатами':''}?`))return;state.people=state.people.filter(x=>x.id!==p.id);state.attending=state.attending.filter(id=>id!==p.id);save();renderPeople()});setupGestures()}function renderResults(){const visible=state.people.filter(p=>p.events.length>0);const date=new Date(state.createdAt).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});app.innerHTML=`<header><button class="headBtn" data-nav="timer">‹ Назад</button><h1 style="font-size:25px">Результаты</h1><button class="headBtn" id="shareTop" aria-label="Экспорт">⇧</button></header><div class="panel"><div class="row" style="justify-content:space-between"><span>📅 ${esc(date)}</span><span>${visible.length} пловцов с результатами</span></div></div>${visible.length?'':'<div class="empty">Пока нет завершённых отрезков или пропусков</div>'}${visible.map(p=>{const open=expanded===p.id;return `<div class="resultsCard"><div class="resultsTop" data-expand="${esc(p.id)}"><div class="left"><div class="nm">${esc(p.name)}</div><div class="marks">${esc(marks(p).join(', '))||'Нет отрезков'}</div></div><div class="counts"><b>${count(p)} отр.</b><small>${p.events.filter(e=>e.type==='skip').length} пропусков</small></div><span style="font-size:22px;margin-left:4px">${open?'⌃':'⌄'}</span></div>${open?`<div class="details"><div class="splitRow head"><span>ОТРЕЗОК</span><span>ВРЕМЯ</span></div>${p.events.map((e,i)=>`<div class="splitRow ${e.type==='skip'?'skiprow':''}"><span>№ ${i+1}</span><b>${e.type==='skip'?'Пропуск':splitFmt(e.duration)}</b></div>`).join('')}<div class="avg"><span>Среднее время</span><b>${avg(p)==null?'—':splitFmt(avg(p))}</b></div></div>`:''}</div>`}).join('')}<button class="primary bottom" id="export">⇩ Экспорт результатов (CSV)</button>`;bindNav();app.querySelectorAll('[data-expand]').forEach(e=>e.onclick=()=>{expanded=expanded===e.dataset.expand?null:e.dataset.expand;renderResults()});app.querySelector('#export').onclick=exportCSV;app.querySelector('#shareTop').onclick=exportCSV}function exportCSV(){const rows=[['Пловец','Номер отрезка','Статус','Время','Начало','Финиш','Отдых до старта (сек)']];for(const p of state.people){p.events.forEach((e,i)=>rows.push([p.name,i+1,e.type==='skip'?'Пропуск':'Финиш',e.type==='skip'?'':fmt(e.duration),e.startedAt?new Date(e.startedAt).toISOString():'',new Date(e.at).toISOString(),e.restBefore==null?'':(e.restBefore/1000).toFixed(1)]))}const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='swim-results-'+new Date(state.createdAt).toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function setupGestures(){const list=app.querySelector(page==='timer'?'#swimmers':'#editList');if(!list)return;let gesture=null;list.querySelectorAll(page==='timer'?'.swimmer':'.personEdit').forEach(el=>{el.addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;if(e.pointerType==='mouse'&&e.button!==0)return;const id=el.dataset.id||el.dataset.person;const r=el.getBoundingClientRect();gesture={id,el,startX:e.clientX,startY:e.clientY,y:e.clientY,mode:'pending',r,hold:setTimeout(()=>{if(gesture?.id!==id||gesture.mode!=='pending')return;gesture.mode='drag';el.classList.add('dragging');if(navigator.vibrate)navigator.vibrate(15)},400)};});el.addEventListener('pointermove',e=>{if(!gesture||gesture.el!==el)return;const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;gesture.y=e.clientY;if(gesture.mode==='pending'&&(Math.abs(dx)>12||Math.abs(dy)>12)){clearTimeout(gesture.hold);gesture.mode=page==='timer'&&dx< -24&&Math.abs(dx)>Math.abs(dy)*1.2?'swipe':'cancel'}if(gesture.mode==='drag'){e.preventDefault();el.style.transform=`translateY(${dy}px)`;el.style.position='relative';el.style.zIndex='5'}} ,{passive:false});const finish=e=>{if(!gesture||gesture.el!==el)return;const g=gesture;gesture=null;clearTimeout(g.hold);el.style.transform='';el.style.position='';el.style.zIndex='';el.classList.remove('dragging');if(g.mode==='swipe'&&e.clientX-g.startX< -55){list.querySelectorAll('.reveal').forEach(x=>x.classList.remove('reveal'));el.classList.add('reveal');revealed=g.id}else if(g.mode==='drag'){const nodes=[...list.children];let target=nodes.find(n=>n!==el&&e.clientY>=n.getBoundingClientRect().top&&e.clientY<n.getBoundingClientRect().bottom);if(!target){target=e.clientY<nodes[0]?.getBoundingClientRect().top?nodes[0]:nodes[nodes.length-1]}const targetId=target?.dataset.id||target?.dataset.person;const from=state.people.findIndex(p=>p.id===g.id),to=state.people.findIndex(p=>p.id===targetId);if(from!==-1&&to!==-1&&from!==to){const [p]=state.people.splice(from,1);state.people.splice(to,0,p);save();render()}}else if(g.mode==='pending'&&revealed){list.querySelectorAll('.reveal').forEach(x=>x.classList.remove('reveal'));revealed=null}};el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',()=>{if(gesture?.el===el){clearTimeout(gesture.hold);gesture=null;el.style.transform='';el.classList.remove('dragging')}})})}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&page==='timer')renderTimer()});setInterval(()=>{if(page!=='timer'||document.hidden)return;const now=Date.now();state.people.forEach(p=>{const el=app.querySelector(`[data-clock="${p.id}"]`);if(el)el.textContent=p.mode==='swim'?fmt(now-p.startedAt):p.mode==='rest'?fmt(now-p.restAt):'00:00.0'})},100);render();})();
</script></body></html>
