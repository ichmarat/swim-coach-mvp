<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081727"><title>100JUZ Timer v0.8</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark;color:#fff;background:#081727}*{box-sizing:border-box}body{margin:0;background:#081727}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:700px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);min-height:100dvh}.timerPage{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:65px;flex-shrink:0}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{font-size:29px}.brandTitle{font-size:clamp(20px,5.6vw,27px);font-weight:800}.subtitle{font-size:12px;color:#afc2d4}.headActions{display:flex;gap:7px}.headBtn{background:#1b3952;border:1px solid #3a5871;color:white;border-radius:13px;padding:10px;font-size:14px;font-weight:650}.headBtn.iconBtn{font-size:21px;min-width:42px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:7px;min-height:0;flex:1;align-content:start}.tile{min-width:0;min-height:0;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 8px 6px;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;position:relative}.tile.ready{background:linear-gradient(145deg,#294762,#16314c);border:1px solid #375d7c}.tile.swim{background:linear-gradient(145deg,#086d50,#034832);border:1px solid #0a7d5a}.tile.rest{background:linear-gradient(145deg,#84601d,#513a13);border:1px solid #987024}.tileName{font-weight:780;font-size:clamp(13px,3.8vw,19px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tileTime{font-weight:790;font-size:clamp(20px,6.4vw,34px);letter-spacing:-.7px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.05}.tileBottom{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;width:100%;gap:3px}.stat{min-width:0;display:flex;flex-direction:column;gap:1px;font-variant-numeric:tabular-nums}.stat.right{text-align:right}.statLabel{font-size:clamp(9px,2.3vw,12px);color:#c5d8e5}.statValue{font-size:clamp(11px,3vw,16px);font-weight:700;white-space:nowrap}.play{display:grid;place-items:center;background:#f3f6f8;border:0;border-radius:50%;width:clamp(31px,8.7vw,45px);height:clamp(31px,8.7vw,45px);padding:9px;flex-shrink:0}.play.stop{background:#f02e37}.play svg{width:100%;height:100%}.footer{display:flex;gap:7px;margin-top:9px;flex-shrink:0;min-height:50px}.footer button{border:1px solid #42617c;border-radius:14px;background:#193852;color:white;padding:8px 10px;font-weight:700}.footer .results{flex:1;font-size:17px}.footer .new{font-size:13px}.footer .more{font-size:22px}.panel{background:#163149;border:1px solid #34536d;border-radius:16px;padding:14px;margin:12px 0}.pageTitle{font-size:25px;font-weight:800}.row{display:flex;align-items:center;gap:9px}.field{min-width:0;flex:1;background:#19354d;color:white;border:1px solid #53718a;border-radius:11px;padding:12px}.primary{background:#078e70;border:0;color:white;border-radius:12px;padding:13px;font-weight:750}.muted{background:#27445e;color:white;border:1px solid #48657d;border-radius:12px;padding:12px;font-weight:650}.attendance{display:flex;align-items:center;gap:12px;background:#17334a;padding:13px;border-radius:12px;margin:7px 0;font-size:19px}.attendance input{width:22px;height:22px;accent-color:#19c49a}.attendance.checked{background:#174c47}.bottom{width:100%;margin-top:14px}.hint{color:#b3c6d5;font-size:13px;line-height:1.5;margin:12px 0}.person{display:flex;align-items:center;gap:7px;background:#17344c;border-radius:12px;padding:10px;margin:7px 0}.person .nm{flex:1;font-weight:700;font-size:19px}.person button{border:0;border-radius:10px;background:#31516b;color:white;padding:8px}.resultCard{background:#17334b;border:1px solid #36556c;border-radius:15px;margin:9px 0;overflow:hidden}.resultTop{display:flex;align-items:center;gap:9px;padding:14px;cursor:pointer}.resultTop .left{flex:1}.resultTop .nm{font-size:21px;font-weight:750}.marks{color:#bbd0df;font-size:14px;margin-top:5px}.counts{text-align:right;font-size:13px}.counts small{display:block;color:#b7cbd9;margin-top:4px}.details{padding:8px 15px 14px;border-top:1px solid #426078}.splitRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #3a5268;font-variant-numeric:tabular-nums}.skiprow{color:#ffd17b}.overlay{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(100%,360px);background:#1b354d;border:1px solid #50708a;border-radius:20px;padding:20px;box-shadow:0 20px 60px #000a}.dialog h2{margin:0 0 9px}.dialog p{color:#c4d4df;line-height:1.45}.dialogButtons{display:flex;gap:9px;margin-top:18px}.dialogButtons button{flex:1}.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);z-index:30;background:#e6f3ff;color:#10243b;padding:12px 15px;border-radius:12px;font-weight:700;white-space:nowrap}.empty{padding:25px;color:#b9cbd8;text-align:center}.wa{background:#174b3d;border:1px solid #2c7d59;color:#b7f7d3;border-radius:10px;padding:10px 13px;font-weight:700;margin:0 12px 12px}.historyItem{width:100%;text-align:left;background:#17334b;border:1px solid #36556c;border-radius:14px;padding:15px;color:#fff;margin:6px 0}.historyItem small{display:block;color:#aec3d5;margin-top:5px}.menuAction{display:block;width:100%;text-align:left;margin:8px 0}.gridEmpty{flex:1}@media(max-height:690px){.header{min-height:48px}.footer{min-height:42px}.tile{border-radius:11px;padding:3px 5px}.tileName{font-size:clamp(12px,3vw,16px)}.tileTime{font-size:clamp(18px,5.2vw,27px)}.play{width:clamp(25px,5vh,36px);height:clamp(25px,5vh,36px);padding:7px}.statLabel{font-size:9px}.statValue{font-size:11px}}@media(max-width:370px){.grid{gap:5px}.tile{padding-left:4px;padding-right:4px}.tileTime{font-size:clamp(18px,5.8vw,26px)}.statValue{font-size:11px}.footer .results{font-size:15px}}
.markgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}.mark{background:#294358;color:white;border:1px solid #48657d;border-radius:9px;padding:10px 3px;font-weight:700}.mark.chosen{outline:2px solid #8acaff;background:#286dab}.mark small{display:block;font-size:10px}.mark:disabled{opacity:.7}.geargrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog{max-height:85dvh;overflow:auto}textarea,select{font:inherit}</style></head><body><div id="app" class="app"></div><script>
(()=>{'use strict';const KEY='swim-coach-v02',HISTORY_KEY='swim-coach-v07-history',MAX=10,DEFAULT=['Анаят','Алена','Эмиль','Алексей','Сергей','Рустам','Николай','Аблай','Марат','Айнура Б.','Дина','Арман','Айнура К.','Татьяна','Асель','Ляззат','Камила','Елена','Марина'];let state,history=[];try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!Array.isArray(history))history=[]}catch(e){}if(!state||!Array.isArray(state.people))state={people:DEFAULT.map((name,i)=>({id:'p'+i,name,events:[],mode:'ready',startedAt:null,restAt:null,phone:''})),createdAt:Date.now()};state.people=state.people.map(p=>({...p,events:Array.isArray(p.events)?p.events:[],mode:p.mode||'ready',phone:p.phone||''}));if(!state.roster19Applied){const old=state.people,used=new Set();state.people=[...DEFAULT.map((name,i)=>{const p=old.find(x=>x.name===name&&!used.has(x.id));if(p){used.add(p.id);return p}return{id:'roster19-'+i,name,events:[],mode:'ready',startedAt:null,restAt:null,phone:''}}),...old.filter(p=>!used.has(p.id))];state.roster19Applied=true}if(!Array.isArray(state.attending)){state.attending=state.people.filter(p=>p.events.length||p.mode==='swim'||p.mode==='rest').map(p=>p.id);state.attendanceChosen=false}state.attending=state.attending.filter(id=>state.people.some(p=>p.id===id));let page=state.attendanceChosen?'timer':'attendance',expanded=null,selectedArchive=null,toastTimer;const app=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Не удалось сохранить данные')}}function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch(e){notify('Архив не сохранился: проверьте память браузера')}}function notify(s){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2700)}const fmt=ms=>{const d=Math.floor(Math.max(0,ms||0)/100),m=Math.floor(d/600),s=Math.floor(d%600/10);return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d%10}`},fmtRest=ms=>{const s=Math.floor(Math.max(0,ms)/1000);return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},marks=p=>p.events.map((e,i)=>e.type==='skip'?'–':String(i+1)),lastFinish=p=>[...p.events].reverse().find(e=>e.type==='finish'),svg=t=>t==='stop'?'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="9" width="30" height="30" rx="3" fill="white"/></svg>':'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 6L41 24 12 42Z" fill="#142334"/></svg>';function nav(){app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()})}function render(){app.className='app'+(page==='timer'?' timerPage':'');if(page==='timer')renderTimer();else if(page==='attendance')renderAttendance();else if(page==='people')renderPeople();else if(page==='history')renderHistory();else if(page==='markup')renderMarkup();else renderResults()}
function card(p){const swim=p.mode==='swim',rest=p.mode==='rest',last=lastFinish(p),time=swim?fmt(Date.now()-(p.startedAt||Date.now())):last?fmt(last.duration):'00:00.0',previous=last?fmt(last.duration):'—',restTime=rest&&p.restAt!=null?fmtRest(Date.now()-p.restAt):'—';return`<div class="tile ${esc(p.mode)}" data-tile="${esc(p.id)}" aria-label="${esc(p.name)}"><div class="tileName">${esc(p.name)}</div><div class="tileTime" data-clock="${esc(p.id)}">${time}</div><div class="tileBottom"><div class="stat"><span class="statLabel">Пред.</span><span class="statValue">${previous}</span></div><button class="play ${swim?'stop':''}" data-toggle="${esc(p.id)}" aria-label="${swim?'Финиш':'Старт'}: ${esc(p.name)}">${svg(swim?'stop':'play')}</button><div class="stat right"><span class="statLabel">Отдых</span><span class="statValue" data-rest="${esc(p.id)}">${restTime}</span></div></div></div>`}function renderTimer(){const active=state.people.filter(p=>state.attending.includes(p.id)).slice(0,MAX);app.innerHTML=`<div class="header"><div class="brand"><span class="logo">🏊</span><div><div class="brandTitle">100JUZ Timer</div><div class="subtitle">Тренировка · ${active.length} пловцов</div></div></div><div class="headActions"><button class="headBtn iconBtn" data-nav="attendance" title="Участники" aria-label="Участники">♙</button><button class="headBtn iconBtn" data-nav="people" title="Список" aria-label="Список пловцов">⚙</button></div></div><div class="grid" id="grid">${active.map(card).join('')}</div>${active.length?'':'<div class="empty">Выберите участников</div>'}<div class="footer"><button class="new" id="new">↻ Новый заплыв</button><button class="results" data-nav="results">▥ Результаты</button><button class="more" id="more" aria-label="Дополнительные действия">•••</button></div>`;nav();app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.toggle)});app.querySelector('#new').onclick=newWorkout;app.querySelector('#more').onclick=showMenu;installLongPress()}
function toggle(id){const p=state.people.find(x=>x.id===id);if(!p)return;const now=Date.now();if(p.mode==='swim'){p.events.push({type:'finish',duration:Math.max(0,now-(p.startedAt||now)),startedAt:p.startedAt,at:now,restBefore:p.restAt==null?null:Math.max(0,(p.startedAt||now)-p.restAt)});p.mode='rest';p.restAt=now;p.startedAt=null}else{p.mode='swim';p.startedAt=now}save();renderTimer()}
function installLongPress(){app.querySelectorAll('[data-tile]').forEach(el=>{let timer=null,startX=0,startY=0,done=false;const cancel=()=>{clearTimeout(timer);timer=null};el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;startX=e.clientX;startY=e.clientY;done=false;cancel();timer=setTimeout(()=>{done=true;timer=null;showSkip(el.dataset.tile)},600)});el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)cancel()});['pointerup','pointercancel','pointerleave'].forEach(type=>el.addEventListener(type,cancel));el.addEventListener('contextmenu',e=>e.preventDefault());el.querySelector('button').addEventListener('click',e=>{if(done){e.preventDefault();e.stopImmediatePropagation();done=false}},true)})}
function modal(title,body,buttons){const wrap=document.createElement('div');wrap.className='overlay';wrap.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${body}<div class="dialogButtons"><button class="muted" data-close>Закрыть</button></div></div>`;document.body.append(wrap);wrap.querySelector('[data-close]').onclick=()=>wrap.remove();wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});if(buttons)buttons(wrap);return wrap}
function showSkip(id){const p=state.people.find(x=>x.id===id);if(!p)return;if(p.mode==='swim'){notify('Сначала завершите текущий отрезок');return}const wrap=modal(p.name,'<p>Пропустить следующий отрезок? Пропуск появится в результатах как «–».</p>',w=>{const b=document.createElement('button');b.className='primary';b.textContent='Пропустить';w.querySelector('.dialogButtons').append(b);b.onclick=()=>{p.events.push({type:'skip',at:Date.now()});save();w.remove();renderTimer();notify('Пропуск записан')}})}function showMenu(){modal('Действия','<button class="muted menuAction" data-act="att">Участники</button><button class="muted menuAction" data-act="history">История тренировок</button><button class="muted menuAction" data-act="backup">Сохранить резервную копию</button><button class="muted menuAction" data-act="restore">Восстановить из копии</button>',w=>{w.querySelector('[data-act="att"]').onclick=()=>{w.remove();page='attendance';render()};w.querySelector('[data-act="history"]').onclick=()=>{w.remove();page='history';render()};w.querySelector('[data-act="backup"]').onclick=()=>{w.remove();backup()};w.querySelector('[data-act="restore"]').onclick=()=>{w.remove();restore()}})}
function renderAttendance(){app.innerHTML=`<div class="header"><div class="pageTitle">Кто сегодня плавает?</div><button class="headBtn" data-nav="people">Список</button></div><div class="panel"><b>Участники тренировки</b><div class="hint">Выберите до ${MAX} пловцов. Порядок соответствует списку.</div><div class="row"><span id="attCount" style="flex:1"></span><button class="muted" id="all">Все</button><button class="muted" id="none">Снять</button></div></div>${state.people.map(p=>`<label class="attendance"><input type="checkbox" data-att="${esc(p.id)}"><span>${esc(p.name)}</span></label>`).join('')}<button class="primary bottom" id="go">✓ К секундомеру</button>`;nav();const refresh=()=>{app.querySelector('#attCount').textContent=`${state.attending.length} из ${MAX}`;app.querySelectorAll('[data-att]').forEach(el=>{el.checked=state.attending.includes(el.dataset.att);el.closest('label').classList.toggle('checked',el.checked)})};app.querySelectorAll('[data-att]').forEach(el=>el.onchange=()=>{if(el.checked){if(state.attending.length>=MAX){el.checked=false;return notify(`Максимум ${MAX} пловцов`)}state.attending.push(el.dataset.att)}else state.attending=state.attending.filter(id=>id!==el.dataset.att);save();refresh()});app.querySelector('#all').onclick=()=>{state.attending=state.people.slice(0,MAX).map(p=>p.id);save();refresh()};app.querySelector('#none').onclick=()=>{state.attending=[];save();refresh()};app.querySelector('#go').onclick=()=>{if(!state.attending.length)return notify('Выберите хотя бы одного пловца');state.attendanceChosen=true;page='timer';save();render()};refresh()}
function renderPeople(){app.innerHTML=`<div class="header"><button class="headBtn" data-nav="attendance">‹ Назад</button><div class="pageTitle">Список пловцов</div></div><div class="row"><input class="field" id="newPerson" placeholder="Имя пловца" maxlength="48"><button class="primary" id="add">+ Добавить</button></div><div class="hint">Телефон WhatsApp сохраняется в карточке ученика. Порядок определяет расположение таймеров.</div>${state.people.map(p=>`<div class="person"><span class="nm">${esc(p.name)}${p.phone?'<small style="display:block;color:#aac5d4;font-size:12px">'+esc(p.phone)+'</small>':''}</span><button data-edit="${esc(p.id)}" aria-label="Редактировать">✎</button><button data-delete="${esc(p.id)}" aria-label="Удалить">×</button></div>`).join('')}<button class="primary bottom" id="done">✓ Готово</button>`;nav();const inp=app.querySelector('#newPerson'),add=()=>{const name=inp.value.trim();if(!name)return;state.people.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name,phone:'',events:[],mode:'ready',startedAt:null,restAt:null});save();renderPeople()};app.querySelector('#add').onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()};app.querySelector('#done').onclick=()=>{page='attendance';render()};app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPerson(b.dataset.edit));app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const p=state.people.find(x=>x.id===b.dataset.delete);if(!confirm(`Удалить ${p.name}${p.events.length?' вместе с текущими результатами':''}? Архив прошлых тренировок останется.`))return;state.people=state.people.filter(x=>x.id!==p.id);state.attending=state.attending.filter(id=>id!==p.id);save();renderPeople()})}
function normalizePhone(v){const digits=String(v||'').replace(/\D/g,'');if(!digits)return'';if(digits.length===11&&digits[0]==='8')return'7'+digits.slice(1);if(digits.length===10)return'7'+digits;return digits}function editPerson(id,callback){const p=state.people.find(x=>x.id===id);if(!p)return;const w=modal('Карточка ученика',`<p>Имя</p><input class="field" id="editName" maxlength="48" value="${esc(p.name)}" style="width:100%"><p>Номер WhatsApp (необязательно)</p><input class="field" id="editPhone" type="tel" inputmode="tel" placeholder="+7 777 123 45 67" value="${esc(p.phone||'')}" style="width:100%"><p class="hint">Номер хранится только в браузере этого устройства.</p>`,wrap=>{const b=document.createElement('button');b.className='primary';b.textContent='Сохранить';wrap.querySelector('.dialogButtons').append(b);b.onclick=()=>{const name=wrap.querySelector('#editName').value.trim(),phone=normalizePhone(wrap.querySelector('#editPhone').value);if(!name)return notify('Укажите имя');if(phone&&(phone.length<10||phone.length>15))return notify('Проверьте номер телефона');p.name=name;p.phone=phone;save();wrap.remove();if(callback)callback();else renderPeople()}})}
function currentWorkout(){return{createdAt:state.createdAt,series:state.series||[],overrides:state.overrides||{},attending:[...state.attending],people:state.people.filter(p=>state.attending.includes(p.id)||p.events.length).map(p=>({id:p.id,name:p.name,events:JSON.parse(JSON.stringify(p.events))}))}}function hasResults(w){return w.people.some(p=>p.events.length)}function archiveCurrent(){const w=currentWorkout();if(!hasResults(w))return;history=history.filter(x=>x.createdAt!==w.createdAt);history.unshift(w);history=history.slice(0,50);saveHistory()}
function renderHistory(){app.innerHTML=`<div class="header"><button class="headBtn" data-nav="timer">‹ Назад</button><div class="pageTitle">История</div></div><div class="hint">Последние ${history.length} из 50 сохранённых тренировок. Хранятся на этом устройстве.</div>${history.length?'':'<div class="empty">Архив пока пуст. Тренировка сохраняется при нажатии «Новый заплыв».</div>'}${history.map((w,i)=>`<button class="historyItem" data-history="${i}"><b>${new Date(w.createdAt).toLocaleDateString('ru-RU')}</b><small>${w.people.filter(p=>p.events.length).length} пловцов · ${w.people.reduce((n,p)=>n+p.events.filter(e=>e.type==='finish').length,0)} отрезков</small></button>`).join('')}`;nav();app.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{selectedArchive=Number(b.dataset.history);expanded=null;page='results';render()})}
function workoutForResults(){return selectedArchive===null?currentWorkout():history[selectedArchive]||currentWorkout()}function renderResults(){const w=workoutForResults(),visible=w.people.filter(p=>p.events.length);app.innerHTML=`<div class="header"><button class="headBtn" id="back">‹ Назад</button><div class="pageTitle">Результаты</div><button class="headBtn" id="export">⇧ CSV</button></div><div class="panel">${new Date(w.createdAt).toLocaleDateString('ru-RU')} · ${visible.length} пловцов с результатами</div>${visible.length?`<button class="muted bottom" id="markup">Разметка тренировки · ${(w.series||[]).reduce((n,s)=>n+s.nums.length,0)} / ${Math.max(...visible.map(p=>p.events.length))}</button><button class="primary bottom" id="sendAll">WhatsApp · Отправить всем</button>`:'<div class="empty">Результатов пока нет</div>'}${visible.map(p=>`<div class="resultCard"><div class="resultTop" data-expand="${esc(p.id)}"><div class="left"><div class="nm">${esc(p.name)}</div><div class="marks">${esc(marks(p).join(', '))}</div></div><div class="counts"><b>${p.events.filter(e=>e.type==='finish').length} отр.</b><small>${p.events.filter(e=>e.type==='skip').length} пропусков</small></div><span>${expanded===p.id?'⌃':'⌄'}</span></div><button class="wa" data-share="${esc(p.id)}">◉ WhatsApp · Отправить</button>${expanded===p.id?`<div class="details">${p.events.map((e,i)=>`<div class="splitRow ${e.type==='skip'?'skiprow':''}"><span>№ ${i+1}${exerciseFor(w,p,i+1)?' · '+esc(exerciseLabel(exerciseFor(w,p,i+1))):''}</span><b>${e.type==='skip'?'Пропуск':fmt(e.duration)}</b></div>`).join('')}</div>`:''}</div>`).join('')}`;app.querySelector('#markup')?.addEventListener('click',()=>{draft=null;page='markup';render()});app.querySelector('#sendAll')?.addEventListener('click',()=>startQueue(w));app.querySelector('#back').onclick=()=>{page=selectedArchive===null?'timer':'history';if(selectedArchive!==null)selectedArchive=null;render()};app.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{expanded=expanded===el.dataset.expand?null:el.dataset.expand;renderResults()});app.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>showShare(w,b.dataset.share));app.querySelector('#export').onclick=()=>exportCSV(w)}
function personalText(w,p){let prev=null;const rows=p.events.map((e,i)=>{const x=exerciseFor(w,p,i+1), label=x?exerciseLabel(x):'Без разметки', key=x?JSON.stringify(x):'';const head=(w.series?.length||Object.keys(w.overrides||{}).length)&&key!==prev?'\n'+label+'\n':'';prev=key;return head+`${i+1}. ${e.type==='skip'?'Пропуск':fmt(e.duration)}`}).join('\n').trim();return`🏊 100JUZ Timer\n${p.name}\nТренировка ${new Date(w.createdAt).toLocaleDateString('ru-RU')}\n\n${rows}\n\nОтрезков: ${p.events.filter(e=>e.type==='finish').length}\nПропусков: ${p.events.filter(e=>e.type==='skip').length}\n\nРезультаты зафиксированы тренером.`}function showShare(w,id){const p=w.people.find(x=>x.id===id);if(!p)return;modal('Отправить результаты',`<p>${esc(p.name)} · ${new Date(w.createdAt).toLocaleDateString('ru-RU')}</p><button class="primary menuAction" data-text>Текстом в WhatsApp</button><button class="muted menuAction" data-copy>Скопировать текст</button>`,wrap=>{wrap.querySelector('[data-text]').onclick=()=>{wrap.remove();sendWhatsApp(w,p)};wrap.querySelector('[data-copy]').onclick=async()=>{const text=personalText(w,p);try{await navigator.clipboard.writeText(text);notify('Текст скопирован')}catch(e){prompt('Скопируйте текст:',text)}wrap.remove()}})}function sendWhatsApp(w,p){const saved=state.people.find(x=>x.id===p.id);if(!saved){notify('Ученик удалён из списка. Скопируйте текст.');return}if(!saved.phone){editPerson(saved.id,()=>sendWhatsApp(w,p));return}const phone=normalizePhone(saved.phone);if(phone.length<10||phone.length>15){editPerson(saved.id,()=>sendWhatsApp(w,p));return}const url='https://wa.me/'+phone+'?text='+encodeURIComponent(personalText(w,p));window.location.href=url}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}function exportCSV(w){const rows=[['Пловец','Отрезок','Тип','Время (сек)','Время','Отдых перед стартом (сек)','Дистанция (м)','Стиль','Техника','Инвентарь','Комментарий']];w.people.forEach(p=>p.events.forEach((e,i)=>rows.push([p.name,i+1,e.type==='skip'?'Пропуск':'Финиш',e.type==='finish'?(e.duration/1000).toFixed(1):'',e.type==='finish'?fmt(e.duration):'',e.restBefore==null?'':(e.restBefore/1000).toFixed(1),...exerciseCSV(exerciseFor(w,p,i+1))])));const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');download('100JUZ-results-'+new Date(w.createdAt).toISOString().slice(0,10)+'.csv',csv,'text/csv;charset=utf-8')}
function newWorkout(){if(state.people.some(p=>p.mode==='swim'))return notify('Сначала завершите текущие отрезки');const had=hasResults(currentWorkout());if(!confirm(had?'Начать новую тренировку? Результаты текущей будут сохранены в истории.':'Начать новую тренировку?'))return;if(had)archiveCurrent();state.people.forEach(p=>{p.events=[];p.mode='ready';p.startedAt=null;p.restAt=null});state.createdAt=Date.now();state.series=[];state.overrides={};state.attending=[];state.attendanceChosen=false;selectedArchive=null;page='attendance';save();render()}
function backup(){download('100JUZ-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'100juz-timer-backup-v08',state,history},null,2),'application/json;charset=utf-8')}function restore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!['swim-coach-backup-v07','100juz-timer-backup-v08'].includes(obj.format)||!obj.state||!Array.isArray(obj.state.people)||!Array.isArray(obj.history))throw Error('Неверный формат');if(!confirm('Восстановление заменит текущий список и историю. Продолжить?'))return;const oldState=state,oldHistory=history;state=obj.state;history=obj.history.slice(0,50);try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch(e){state=oldState;history=oldHistory;throw e}state.people=state.people.map(p=>({...p,events:Array.isArray(p.events)?p.events:[],phone:p.phone||''}));selectedArchive=null;page='attendance';render();notify('Резервная копия восстановлена')}catch(e){notify('Не удалось прочитать резервную копию')}};input.click()}

const GEAR=['Ласты','Большие лопатки','Колобашка','Маленькие лопатки','Стаканчики','Резина'], STYLES=['Не указан','Кроль','Брасс','Баттерфляй','На спине','Комплекс'], TECH=['Не указана','Координация','Руки','Ноги','Другое'];let draft=null, editIndex=-1, individual=null;
function exerciseFor(w,p,n){const k=p.id+':'+n;if(Object.prototype.hasOwnProperty.call(w.overrides||{},k))return w.overrides[k];return (w.series||[]).find(s=>s.nums.includes(n))||null}
function exerciseLabel(x){return [x.distance+' м',x.style==='Не указан'?'':x.style,x.tech==='Не указана'?'':x.tech,x.gear?.length?x.gear.join(' + '):'Без инвентаря',x.comment].filter(Boolean).join(' · ')}
function exerciseCSV(x){return x?[x.distance,x.style,x.tech,(x.gear||[]).join(' + '),x.comment||'']:['','','','','']}
function persistMarkup(w){if(selectedArchive===null){state.series=w.series;state.overrides=w.overrides;save()}else{history[selectedArchive]=w;saveHistory()}}
function blank(nums){return {nums,distance:'',style:'Не указан',tech:'Не указана',gear:[],comment:''}}
function renderMarkup(){const w=workoutForResults();w.series=w.series||[];w.overrides=w.overrides||{};const max=Math.max(0,...w.people.map(p=>p.events.length)), all=Array.from({length:max},(_,i)=>i+1), free=all.filter(n=>!w.series.some(s=>s.nums.includes(n)));if(!draft){editIndex=-1;individual=null;draft=blank(free.slice(0,1))}const allowed=individual?draft.nums:all.filter(n=>free.includes(n)||w.series[editIndex]?.nums.includes(n));const active=individual||free.length||editIndex>=0;let recent=[];for(const x of [...w.series,...history.flatMap(h=>h.series||[])]){if(!recent.some(y=>exerciseLabel(y)===exerciseLabel(x)))recent.push(x)}recent=recent.slice(0,6);
app.innerHTML=`<div class="header"><button class="headBtn" id="backMarkup">‹ Назад</button><div class="pageTitle">Разметка</div></div><div class="panel">Размечено ${max-free.length} / ${max}<div class="markgrid">${all.map(n=>`<button data-num="${n}" class="mark ${draft.nums.includes(n)?'chosen':''}" style="${w.series.some(s=>s.nums.includes(n))?'background:'+palette(w.series.findIndex(s=>s.nums.includes(n))):''}" ${!allowed.includes(n)||individual?'disabled':''}>${n}</button>`).join('')}</div></div>${w.series.map((x,i)=>`<div class="panel row"><span style="color:${palette(i)}">●</span><div style="flex:1"><b>${x.nums.join(', ')} · ${esc(exerciseLabel(x))}</b></div><button class="muted" data-series="${i}">✎</button></div>`).join('')}${active?`<div class="panel"><b>${individual?'Индивидуальная корректировка':editIndex>=0?'Редактирование серии':'Новая серия'}</b>${individual?'':`<div class="row" style="justify-content:space-between;margin:12px 0"><button class="muted" id="minus">−</button><b>${draft.nums.length} отр.</b><button class="muted" id="plus">+</button></div>`}<div class="hint">Дистанция, м</div><div class="markgrid">${[50,100,200,400].map(d=>`<button class="mark ${Number(draft.distance)===d?'chosen':''}" data-dist="${d}">${d}</button>`).join('')}</div><input id="dist" class="field bottom" type="number" min="1" placeholder="Другая дистанция" value="${esc(draft.distance)}"><div class="hint">Стиль</div><select id="style" class="field bottom">${STYLES.map(x=>`<option ${x===draft.style?'selected':''}>${x}</option>`).join('')}</select><div class="hint">Техника</div><select id="tech" class="field bottom">${TECH.map(x=>`<option ${x===draft.tech?'selected':''}>${x}</option>`).join('')}</select><div class="hint">Инвентарь</div><div class="geargrid">${GEAR.map(g=>`<label><input type="checkbox" data-gear="${g}" ${draft.gear.includes(g)?'checked':''}> ${g}</label>`).join('')}</div><textarea id="comment" class="field bottom" placeholder="Комментарий">${esc(draft.comment||'')}</textarea>${recent.length?`<div class="hint">Недавние упражнения</div>${recent.map((x,i)=>`<button class="muted menuAction" data-recent="${i}">${esc(exerciseLabel(x))}</button>`).join('')}`:''}<button class="primary bottom" id="saveSeries">Сохранить ${individual?'корректировку':'серию'}</button>${editIndex>=0||individual?'<button class="muted bottom" id="removeSeries">'+(individual?'Вернуть общую разметку':'Удалить серию')+'</button>':''}</div>`:'<div class="panel">✓ Общая разметка завершена</div>'}<div class="panel"><b>Проверка по пловцам</b><div class="hint">Нажмите на отрезок для индивидуальной корректировки. Проверьте различия в заданиях.</div>${w.people.filter(p=>p.events.length).map(p=>`<div class="hint">${esc(p.name)}</div><div class="markgrid">${p.events.map((e,i)=>{const x=exerciseFor(w,p,i+1);return `<button class="mark" data-person="${esc(p.id)}" data-event="${i+1}" style="${x?'background:'+exerciseColor(w,p,i+1,x):''}">${i+1}<small>${e.type==='skip'?'–':fmt(e.duration)}</small><small>${x?esc(x.distance)+' м':'?'}</small></button>`}).join('')}</div>`).join('')}</div>`;
const q=id=>app.querySelector(id), bind=(id,fn)=>{if(q(id))q(id).onclick=fn};bind('#backMarkup',()=>{draft=null;page='results';render()});app.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{const n=+b.dataset.num;draft.nums=draft.nums.includes(n)?draft.nums.filter(x=>x!==n):[...draft.nums,n].sort((a,b)=>a-b);renderMarkup()});bind('#minus',()=>{draft.nums.pop();renderMarkup()});bind('#plus',()=>{const n=allowed.find(n=>!draft.nums.includes(n));if(n){draft.nums.push(n);draft.nums.sort((a,b)=>a-b);renderMarkup()}});app.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{draft.distance=b.dataset.dist;renderMarkup()});if(q('#dist')){q('#dist').oninput=e=>draft.distance=e.target.value;q('#style').onchange=e=>draft.style=e.target.value;q('#tech').onchange=e=>draft.tech=e.target.value;q('#comment').oninput=e=>draft.comment=e.target.value;app.querySelectorAll('[data-gear]').forEach(b=>b.onchange=()=>{draft.gear=b.checked?[...draft.gear,b.dataset.gear]:draft.gear.filter(g=>g!==b.dataset.gear)})}app.querySelectorAll('[data-recent]').forEach(b=>b.onclick=()=>{draft={...recent[+b.dataset.recent],nums:draft.nums,gear:[...recent[+b.dataset.recent].gear]};renderMarkup()});app.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{individual=null;editIndex=+b.dataset.series;draft=JSON.parse(JSON.stringify(w.series[editIndex]));renderMarkup()});app.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const p=w.people.find(p=>p.id===b.dataset.person),n=+b.dataset.event,x=exerciseFor(w,p,n);individual=p.id+':'+n;editIndex=-1;draft=x?{...JSON.parse(JSON.stringify(x)),nums:[n]}:blank([n]);renderMarkup();q('#saveSeries')?.scrollIntoView({block:'center'})});bind('#saveSeries',()=>{if(!draft.nums.length||!Number.isInteger(+draft.distance)||+draft.distance<=0)return notify('Выберите отрезки и дистанцию');if(individual)w.overrides[individual]=draft;else if(editIndex>=0)w.series[editIndex]=draft;else w.series.push(draft);persistMarkup(w);draft=null;renderMarkup()});bind('#removeSeries',()=>{if(individual)delete w.overrides[individual];else w.series.splice(editIndex,1);persistMarkup(w);draft=null;renderMarkup()})}
function exerciseColor(w,p,n,x){const series=w.series||[], key=e=>JSON.stringify([Number(e.distance),e.style,e.tech,[...(e.gear||[])].sort(),e.comment||'']);const k=key(x), original=series.findIndex(s=>s.nums.includes(n));if(original>=0&&key(series[original])===k)return palette(original);const match=series.findIndex(s=>key(s)===k);if(match>=0)return palette(match);return '#A24F70'}
function palette(i){return ['#286DAB','#137F71','#8763A9','#A17A36','#A24F70'][i%5]}
function startQueue(w){const key='100juz-queue-'+w.createdAt;let done=[];try{done=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}const people=w.people.filter(p=>p.events.length);const show=()=>{const wrap=modal('Рассылка результатов',`<p>${done.length} из ${people.length} обработано. Отправку подтвердите в WhatsApp, затем вернитесь сюда.</p>${people.map(p=>`<div class="row" style="margin:8px 0"><span style="flex:1">${esc(p.name)}</span><button class="muted" data-q="${esc(p.id)}">${done.includes(p.id)?'Повторить':'Открыть'}</button><button class="muted" data-ok="${esc(p.id)}">${done.includes(p.id)?'✓':'Отмечено?'}</button></div>`).join('')}<p class="hint">Отметка вручную, не подтверждение доставки.</p>`,()=>{});wrap.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const p=people.find(p=>p.id===b.dataset.q);wrap.remove();sendWhatsApp(w,p)});wrap.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const id=b.dataset.ok;done=done.includes(id)?done.filter(x=>x!==id):[...done,id];localStorage.setItem(key,JSON.stringify(done));wrap.remove();show()})};show()}

function tick(){if(page!=='timer'||document.hidden)return;const now=Date.now();state.people.forEach(p=>{const c=app.querySelector(`[data-clock="${CSS.escape(p.id)}"]`);if(p.mode==='swim'&&c)c.textContent=fmt(now-(p.startedAt||now));if(p.mode==='rest'&&p.restAt!=null){const r=app.querySelector(`[data-rest="${CSS.escape(p.id)}"]`);if(r)r.textContent=fmtRest(now-p.restAt)}})}setInterval(tick,100);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});save();render();
})();
</script></body></html>
