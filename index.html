<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081727"><title>Swim Coach v0.4</title><style>

#fff;border:0;border-radius:50%;width:39px;height:39px;font-size:18px}.danger{background:#743b40}.field{background:#142d44;border:1px solid #57758c;color:white;border-radius:12px;padding:12px;min-width:0;flex:1}.row{display:flex;gap:8px}.resultsCard{background:#17334b;border:1px solid #36556c;border-radius:16px;margin:9px 0;overflow:hidden}.resultsTop{display:flex;align-items:center;gap:9px;padding:15px;cursor:pointer}.resultsTop .left{flex:1;min-width:0}.resultsTop .nm{font-size:23px;font-weight:750}.resultsTop .marks{font-size:15px;color:#c5d4df;margin-top:5px}.counts{text-align:right;white-space:nowrap}.counts small{display:block;color:#b7cbd9;margin-top:4px}.details{padding:10px 16px 16px;border-top:1px solid #466078}.splitRow{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid #39546c;font-variant-numeric:tabular-nums}.splitRow.skiprow{color:#ffca6c}.avg{display:flex;justify-content:space-between;margin-top:13px}.empty{text-align:center;padding:35px 12px;color:#b1c5d3}.toast{position:fixed;z-index:10000;bottom:calc(env(safe-area-inset-bottom) + 20px);left:50%;transform:translateX(-50%);background:#e5f4ff;color:#10243b;padding:12px 17px;border-radius:14px;font-weight:700;white-space:nowrap;box-shadow:0 8px 25px #0007}@media(max-width:380px){.app{padding-left:8px;padding-right:8px}.swimmer-inner{padding:10px 9px}.stats{gap:3px}.stat-value.main{font-size:24px}.stat-value.marks{font-size:14px}}
</style></head><body><div class="app" id="app"></div><script>
(()=>{'use strict';
const KEY='swim-coach-v02',DEFAULT=['Анаят','Алена','Эмиль','Алексей','Сергей','Рустам','Николай','Аблай','Марат','Айнура Б.','Дина','Арман','Айнура К.','Татьяна','Асель','Ляззат','Камила','Елена','Марина'];
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state||!Array.isArray(state.people))state={people:DEFAULT.map((name,i)=>({id:'p'+i,name,events:[],mode:'ready',startedAt:null,restAt:null})),createdAt:Date.now()};state.people=state.people.map(p=>({...p,events:Array.isArray(p.events)?p.events:[],mode:p.mode||'ready'}));if(!state.roster19Applied){const old=state.people,used=new Set();state.people=[...DEFAULT.map((name,i)=>{const p=old.find(x=>x.name===name&&!used.has(x.id));if(p){used.add(p.id);return p}return {id:'roster19-'+i,name,events:[],mode:'ready',startedAt:null,restAt:null}}),...old.filter(p=>!used.has(p.id))];state.roster19Applied=true}if(!Array.isArray(state.attending)){state.attending=state.people.filter(p=>p.events.length||p.mode==='swim'||p.mode==='rest').map(p=>p.id);state.attendanceChosen=false}state.attending=state.attending.filter(id=>state.people.some(p=>p.id===id));
let page=state.attendanceChosen?'timer':'attendance',expanded=null,revealed=null,toastTimer;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Не удалось сохранить данные')}}save();function notify(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),2200)}
const fmt=ms=>{const d=Math.floor(Math.max(0,ms||0)/100),m=Math.floor(d/600),s=Math.floor((d%600)/10);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d%10}`};const restFmt=ms=>{const t=Math.floor(Math.max(0,ms||0)/1000);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`};const marks=p=>p.events.map((e,i)=>e.type==='skip'?'–':String(i+1));const lastFive=p=>marks(p).slice(-5).join(', ');const lastFinish=p=>[...p.events].reverse().find(e=>e.type==='finish');const avg=p=>{const a=p.events.filter(e=>e.type==='finish').map(e=>e.duration);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};const svg=t=>t==='stop'?'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="8" width="32" height="32" rx="3" fill="white"/></svg>':'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M11 6L41 24 11 42Z" fill="#101820"/></svg>';
function render(){if(page==='timer')renderTimer();else if(page==='attendance')renderAttendance();else if(page==='people')renderPeople();else renderResults()};function bindNav(){app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;revealed=null;render()})}
function renderAttendance(){app.innerHTML=`<header><h1 style="font-size:26px">Кто сегодня плавает?</h1><button class="headBtn" data-nav="people">Список</button></header><div class="panel"><div class="smallHeading">Участники тренировки</div><div class="subtle">Выберите присутствующих. Порядок сохранится.</div><div class="attendanceToolbar"><span id="attCount"></span><div class="row"><button class="mutedBtn" id="selectAll">Все</button><button class="mutedBtn" id="selectNone">Снять</button></div></div></div><div>${state.people.map(p=>`<label class="attendanceRow"><input type="checkbox" data-att="${esc(p.id)}"><span>${esc(p.name)}</span></label>`).join('')}</div><button class="primary bottom" id="startWorkout">✓ К секундомеру</button>`;bindNav();const refresh=()=>{app.querySelector('#attCount').textContent=`${state.attending.length} из ${state.people.length}`;app.querySelectorAll('[data-att]').forEach(el=>{el.checked=state.attending.includes(el.dataset.att);el.closest('label').classList.toggle('checked',el.checked)})};app.querySelectorAll('[data-att]').forEach(el=>el.onchange=()=>{if(el.checked){if(!state.attending.includes(el.dataset.att))state.attending.push(el.dataset.att)}else state.attending=state.attending.filter(id=>id!==el.dataset.att);save();refresh()});app.querySelector('#selectAll').onclick=()=>{state.attending=state.people.map(p=>p.id);save();refresh()};app.querySelector('#selectNone').onclick=()=>{state.attending=[];save();refresh()};app.querySelector('#startWorkout').onclick=()=>{if(!state.attending.length)return notify('Выберите хотя бы одного пловца');state.attendanceChosen=true;page='timer';save();render()};refresh()}
function card(p){const swimming=p.mode==='swim',resting=p.mode==='rest';const current=swimming?fmt(Date.now()-(p.startedAt||Date.now())):resting?(lastFinish(p)?fmt(lastFinish(p).duration):'00:00.0'):'00:00.0';return `<div class="swimmer ${esc(p.mode)}" data-id="${esc(p.id)}"><button class="skip" data-skip="${esc(p.id)}">Пропуск</button><div class="swimmer-inner"><div class="top"><div class="name">${esc(p.name)}</div><button class="play ${swimming?'stop':''}" data-toggle="${esc(p.id)}" aria-label="${swimming?'Финиш':'Старт'}: ${esc(p.name)}">${svg(swimming?'stop':'play')}</button></div><div class="stats"><div class="stat"><div class="stat-label">Отрезки</div><div class="stat-value marks">${esc(lastFive(p))||' '}</div></div><div class="stat center"><div class="stat-label">${swimming?'Плывёт':resting?'Последний':'Ожидает'}</div><div class="stat-value main" data-clock="${esc(p.id)}">${current}</div></div><div class="stat right"><div class="stat-label" data-rest-label="${esc(p.id)}">${resting?'Отдых':''}</div><div class="stat-value" data-rest="${esc(p.id)}">${resting?restFmt(Date.now()-(p.restAt||Date.now())):''}</div></div></div></div></div>`}
function renderTimer(){const active=state.people.filter(p=>state.attending.includes(p.id));app.innerHTML=`<header><h1>Секундомер</h1><div class="headActions"><button class="headBtn" data-nav="attendance">Участники</button><button class="headBtn" data-nav="results">Результаты</button></div></header><div class="list" id="swimmers">${active.map(card).join('')}</div>${active.length?'':'<div class="empty">Выберите участников тренировки</div>'}<div class="hint">Удерживайте карточку 0,4 сек., затем перетащите · свайп влево для пропуска</div><div class="footerActions"><button class="mutedBtn" data-new>Новая тренировка</button></div>`;bindNav();app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));app.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>skip(b.dataset.skip));app.querySelector('[data-new]').onclick=newWorkout;setupGestures('#swimmers','.swimmer','id')}
function toggle(id){const p=state.people.find(x=>x.id===id);if(!p)return;const now=Date.now();if(p.mode==='swim'){p.events.push({type:'finish',duration:Math.max(0,now-p.startedAt),startedAt:p.startedAt,at:now,restBefore:p.restAt==null?null:Math.max(0,p.startedAt-p.restAt)});p.mode='rest';p.restAt=now;p.startedAt=null}else{p.mode='swim';p.startedAt=now}revealed=null;save();renderTimer()}
function skip(id){const p=state.people.find(x=>x.id===id);if(!p)return;if(p.mode==='swim')return notify('Сначала завершите текущий отрезок');p.events.push({type:'skip',at:Date.now()});revealed=null;save();renderTimer()}
function newWorkout(){if(!confirm('Начать новую тренировку? Текущие результаты будут очищены. Сначала экспортируйте результаты, если они нужны.'))return;state.people.forEach(p=>{p.events=[];p.mode='ready';p.startedAt=null;p.restAt=null});state.createdAt=Date.now();state.attending=[];state.attendanceChosen=false;page='attendance';save();render()}
function renderPeople(){app.innerHTML=`<header><button class="headBtn" data-nav="attendance">‹ Назад</button><h1 style="font-size:24px">Список пловцов</h1><span></span></header><div class="row"><input class="field" id="newPerson" placeholder="Имя пловца" maxlength="48"><button class="primary" id="addPerson">+ Добавить</button></div><div class="hint">Удерживайте строку для изменения порядка</div><div id="editList">${state.people.map(p=>`<div class="personEdit" data-person="${esc(p.id)}"><div class="nm">${esc(p.name)}</div><button class="small" data-edit="${esc(p.id)}">✎</button><button class="small danger" data-delete="${esc(p.id)}">×</button></div>`).join('')}</div><button class="primary bottom" id="done">✓ Готово</button>`;bindNav();const inp=app.querySelector('#newPerson'),add=()=>{const name=inp.value.trim();if(!name)return;state.people.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name,events:[],mode:'ready',startedAt:null,restAt:null});save();renderPeople()};app.querySelector('#addPerson').onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()};app.querySelector('#done').onclick=()=>{page='attendance';render()};app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=state.people.find(x=>x.id===b.dataset.edit),s=prompt('Имя пловца',p.name);if(s!==null&&s.trim()){p.name=s.trim();save();renderPeople()}});app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const p=state.people.find(x=>x.id===b.dataset.delete);if(!confirm(`Удалить ${p.name}${p.events.length?' вместе с результатами':''}?`))return;state.people=state.people.filter(x=>x.id!==p.id);state.attending=state.attending.filter(id=>id!==p.id);save();renderPeople()});setupGestures('#editList','.personEdit','person')}
function renderResults(){const visible=state.people.filter(p=>p.events.length);app.innerHTML=`<header><button class="headBtn" data-nav="timer">‹ Назад</button><h1 style="font-size:25px">Результаты</h1><button class="headBtn" id="export">⇧ CSV</button></header><div class="panel">${new Date(state.createdAt).toLocaleDateString('ru-RU')} · ${visible.length} пловцов с результатами</div>${visible.length?'':'<div class="empty">Результатов пока нет</div>'}${visible.map(p=>`<div class="resultsCard"><div class="resultsTop" data-expand="${esc(p.id)}"><div class="left"><div class="nm">${esc(p.name)}</div><div class="marks">${esc(marks(p).join(', '))}</div></div><div class="counts"><b>${p.events.filter(e=>e.type==='finish').length} отр.</b><small>${p.events.filter(e=>e.type==='skip').length} пропусков</small></div><span>${expanded===p.id?'⌃':'⌄'}</span></div>${expanded===p.id?`<div class="details">${p.events.map((e,i)=>`<div class="splitRow ${e.type==='skip'?'skiprow':''}"><span>№ ${i+1}</span><b>${e.type==='skip'?'Пропуск':fmt(e.duration)}</b></div>`).join('')}<div class="avg"><span>Среднее время</span><b>${avg(p)===null?'—':fmt(avg(p))}</b></div></div>`:''}</div>`).join('')}`;bindNav();app.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{expanded=expanded===el.dataset.expand?null:el.dataset.expand;renderResults()});app.querySelector('#export').onclick=exportCSV}
function exportCSV(){const rows=[['Пловец','Отрезок','Тип','Время (сек)','Время','Отдых перед стартом (сек)']];state.people.forEach(p=>p.events.forEach((e,i)=>rows.push([p.name,i+1,e.type==='skip'?'Пропуск':'Финиш',e.type==='finish'?(e.duration/1000).toFixed(1):'',e.type==='finish'?fmt(e.duration):'',e.restBefore==null?'':(e.restBefore/1000).toFixed(1)])));const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='swim-results-'+new Date(state.createdAt).toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function setupGestures(listSelector,itemSelector,attr){const list=app.querySelector(listSelector);if(!list)return;let g=null;const getItems=()=>[...list.querySelectorAll(itemSelector)];function start(el,x,y,kind){if(g)return;const id=el.dataset[attr];g={el,id,x,y,lastX:x,lastY:y,kind,mode:'pending',timer:setTimeout(()=>activate(),400),ghost:null,target:null,scrollTimer:null}}function activate(){if(!g||g.mode!=='pending')return;g.mode='drag';const r=g.el.getBoundingClientRect();g.offsetY=g.y-r.top;g.offsetX=g.x-r.left;const ghost=g.el.cloneNode(true);ghost.classList.remove('reveal');ghost.classList.add('dragGhost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';document.body.append(ghost);g.ghost=ghost;g.el.classList.add('drag-origin');document.body.classList.add('is-dragging');if(navigator.vibrate)navigator.vibrate(12);move(g.lastX,g.lastY)}function move(x,y){if(!g)return;g.lastX=x;g.lastY=y;const dx=x-g.x,dy=y-g.y;if(g.mode==='pending'&&(Math.abs(dx)>12||Math.abs(dy)>12)){clearTimeout(g.timer);g.mode=page==='timer'&&dx< -22&&Math.abs(dx)>Math.abs(dy)*1.2?'swipe':'cancel'}if(g.mode!=='drag')return;g.ghost.style.left=(x-g.offsetX)+'px';g.ghost.style.top=(y-g.offsetY)+'px';const candidates=getItems().filter(el=>el!==g.el);let target=candidates.find(el=>{const r=el.getBoundingClientRect();return y>=r.top&&y<=r.bottom});if(!target&&candidates.length)target=y<candidates[0].getBoundingClientRect().top?candidates[0]:candidates[candidates.length-1];if(g.target!==target){g.target?.classList.remove('drop-target');g.target=target;target?.classList.add('drop-target')}if(y<75)window.scrollBy(0,-15);else if(y>innerHeight-75)window.scrollBy(0,15)}function finish(x,y,cancel=false){if(!g)return;const q=g;g=null;clearTimeout(q.timer);q.ghost?.remove();q.el.classList.remove('drag-origin');q.target?.classList.remove('drop-target');document.body.classList.remove('is-dragging');if(cancel)return;if(q.mode==='swipe'&&x-q.x< -55){list.querySelectorAll('.reveal').forEach(el=>el.classList.remove('reveal'));q.el.classList.add('reveal');revealed=q.id}else if(q.mode==='drag'&&q.target){const from=state.people.findIndex(p=>p.id===q.id),to=state.people.findIndex(p=>p.id===q.target.dataset[attr]);if(from>=0&&to>=0&&from!==to){const [p]=state.people.splice(from,1);state.people.splice(to,0,p);save();render()}}else if(q.mode==='pending'&&revealed){list.querySelectorAll('.reveal').forEach(el=>el.classList.remove('reveal'));revealed=null}}

list.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||(e.pointerType==='mouse'&&e.button!==0))return;const el=e.target.closest(itemSelector);if(!el||e.target.closest('button,input'))return;start(el,e.clientX,e.clientY,'pointer')});window.addEventListener('pointermove',e=>{if(g?.kind==='pointer'){if(g.mode==='drag')e.preventDefault();move(e.clientX,e.clientY)}},{passive:false});window.addEventListener('pointerup',e=>{if(g?.kind==='pointer')finish(e.clientX,e.clientY)});window.addEventListener('pointercancel',()=>{if(g?.kind==='pointer')finish(0,0,true)});
}
function tick(){if(page!=='timer'||document.hidden)return;const now=Date.now();state.people.forEach(p=>{const c=app.querySelector(`[data-clock="${CSS.escape(p.id)}"]`),r=app.querySelector(`[data-rest="${CSS.escape(p.id)}"]`);if(c&&p.mode==='swim')c.textContent=fmt(now-(p.startedAt||now));if(r&&p.mode==='rest')r.textContent=restFmt(now-(p.restAt||now))})}setInterval(tick,100);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&page==='timer')tick()});render();
})();
</script></body></html>
