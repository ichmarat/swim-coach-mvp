<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e19"><title>Swim Coach MVP</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f6f8fc;background:#080e19;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:680px;margin:auto;padding:18px 14px 42px}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 0 18px}.top h1{font-size:23px;margin:0}.subtle{color:#a8b4c7}.tiny{font-size:12px}.btnIcon{background:#1a273b;color:#dce9fc;border:1px solid #3b4d65;border-radius:11px;min-width:42px;height:42px}.overview{background:linear-gradient(140deg,#101e30,#0b1422);border:1px solid #34455b;border-radius:20px;padding:17px;margin-bottom:16px}.overview .meta{display:flex;justify-content:space-between;color:#c9d5e5;font-size:14px}.overview h2{font-size:24px;margin:12px 0 14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.summary div{border-right:1px solid #34455b;padding:0 6px}.summary div:last-child{border:0}.summary b{font-size:13px}.summary small{display:block;color:#aab6c8;font-size:12px;margin-top:4px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#192536;border:1px solid #39485c;border-radius:16px;padding:3px;gap:2px}.tabs button{border:0;background:transparent;color:#cbd5e5;padding:13px 3px;border-radius:13px;font-size:13px}.tabs button.active{background:#137e50;color:white;font-weight:700}.section{display:flex;justify-content:space-between;align-items:center;margin:19px 4px 13px}.section strong{font-size:23px}.section span{color:#c0cada;font-size:13px}.athletes{display:grid;gap:10px}.athlete{border:1px solid;border-radius:17px;padding:12px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;min-height:110px;position:relative}.athlete.swim{background:#082b1d;border-color:#0fa765}.athlete.rest{background:#302b0c;border-color:#a88e00}.athlete.over{background:#35151a;border-color:#b72f39}.athlete.idle,.athlete.done{background:#172233;border-color:#3d5067}.name{font-size:19px;font-weight:750}.state{font-size:13px;color:#e1e6ec;margin-top:3px}.last{font-size:12px;color:#bdc9d8;margin-top:8px}.clock{font-size:clamp(22px,5.7vw,33px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-1px;white-space:nowrap}.swim .clock{color:#4af48a}.rest .clock{color:#ffe046}.over .clock{color:#ff616a}.action{border:2px solid #8ec9f7;border-radius:15px;background:#111d2d;color:white;min-width:105px;min-height:64px;padding:7px;font-size:15px;font-weight:750;line-height:1.25}.action:active{transform:scale(.97)}.athlete.swim .action{border-color:#f0f8ff}.miniActions{display:flex;gap:5px;margin-top:8px}.smallButton{font-size:11px;background:#263449;border:1px solid #53647c;border-radius:7px;color:#e6efff;padding:6px 8px}.smallButton.warn{border-color:#b98b3a}.footer{margin:20px 3px;color:#8796ac;font-size:12px;line-height:1.5}.modalBackdrop{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{width:min(680px,100%);background:#121e2f;border:1px solid #344a64;border-radius:24px 24px 0 0;padding:22px 18px calc(25px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.sheet h2{margin:0 0 15px;font-size:21px}.sheet label{display:block;color:#aebed2;font-size:13px;margin:12px 0 6px}.sheet input,.sheet select{background:#202f43;border:1px solid #455971;border-radius:10px;padding:11px;color:white;width:100%;font-size:16px}.sheet .buttons{display:flex;gap:8px;margin-top:20px}.primary,.secondary{border-radius:12px;padding:13px;border:1px solid #468ff5;font-weight:700}.primary{background:#1475e4;color:white;flex:1}.secondary{background:#26364a;color:white}.resultsTable{width:100%;border-collapse:collapse;font-size:13px}.resultsTable td,.resultsTable th{padding:9px 5px;border-bottom:1px solid #34465a;text-align:left}.notice{background:#24354b;padding:12px;border-radius:12px;color:#d6e5f7;font-size:13px;margin:12px 0}.sheetGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-block;border-radius:7px;padding:3px 7px;background:#27384e;font-size:12px}.empty{color:#b4c0d1;text-align:center;padding:30px}.right{display:flex;gap:6px;align-items:center}.banner{background:#1c304b;border:1px solid #3a5d86;border-radius:12px;padding:10px;margin-bottom:12px;font-size:12px;color:#dceaff}@media(max-width:390px){.athlete{gap:5px;padding:10px 8px}.action{min-width:88px;font-size:13px}.clock{font-size:23px}.name{font-size:17px}.summary b{font-size:12px}}
</style></head><body><div id="root"></div><script>
const KEY='swim_coach_mvp_v1';const seed=()=>({group:'fast',startedAt:Date.now(),groups:{fast:{name:'Быстрые',count:10,distance:100,rest:20,members:['Анаят','Алена','Эмиль','Алексей']},medium:{name:'Средние',count:8,distance:100,rest:30,members:['Рустам','Пловец 6','Пловец 7']},slow:{name:'Медленные',count:6,distance:100,rest:45,members:['Пловец 8','Пловец 9']}},athletes:{},events:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}for(const [key,g] of Object.entries(state.groups))for(const name of g.members)if(!state.athletes[name])state.athletes[name]={group:key,number:1,status:'idle',start:null,restStart:null,results:[],history:[]};let modal=null;const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const clock=ms=>{let t=Math.max(0,ms);return `${pad(Math.floor(t/60000))}:${pad(Math.floor(t/1000)%60)}.${Math.floor(t%1000/100)}`};const restClock=sec=>`${sec<0?'−':''}${pad(Math.floor(Math.abs(sec)/60))}:${pad(Math.abs(sec)%60)}`;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const log=(name,type,data={})=>{state.events.push({at:Date.now(),name,type,...data});save()};const groupNames=Object.keys(state.groups);function act(name){const a=state.athletes[name],g=state.groups[a.group],now=Date.now();if(a.status==='done')return;if(a.status==='swim'){const duration=now-a.start;a.results.push({number:a.number,distance:g.distance,duration,group:a.group,at:now,status:'finished'});a.history.push({type:'finish',at:now,number:a.number,duration});a.start=null;a.restStart=now;a.status=a.number>=g.count?'done':'rest';if(a.status!=='done')a.number++;log(name,'finish',{duration,number:a.status==='done'?a.number:a.number-1});}else{if(a.restStart){a.history.push({type:'rest',duration:now-a.restStart,at:now});}a.start=now;a.restStart=null;a.status='swim';a.history.push({type:'start',at:now,number:a.number});log(name,'start',{number:a.number});}render();}function skip(name){const a=state.athletes[name],g=state.groups[a.group];if(a.status==='swim'){alert('Сначала зафиксируйте финиш. Пропуск доступен до старта отрезка.');return;}if(a.status==='done')return;if(!confirm(`${name}: пропустить отрезок ${a.number}/${g.count}?`))return;a.results.push({number:a.number,distance:g.distance,group:a.group,at:Date.now(),status:'skipped'});a.history.push({type:'skip',at:Date.now(),number:a.number});a.number++;a.status=a.number>g.count?'done':'rest';if(a.status==='rest'&&!a.restStart)a.restStart=Date.now();log(name,'skip',{number:a.number-1});render();}function undo(name){const a=state.athletes[name],last=a.history.at(-1);if(!last)return; if(!confirm(`Отменить последнее действие для ${name}?`))return; a.history.pop();if(last.type==='skip'){a.results.pop();a.number=last.number;a.status=a.restStart?'rest':'idle';}else if(last.type==='start'){a.start=null;a.status=a.restStart?'rest':'idle';}else if(last.type==='finish'){a.results.pop();a.number=last.number;a.start=last.at-last.duration;a.restStart=null;a.status='swim';}else if(last.type==='rest'){alert('Отмена предыдущего старта доступна только сразу после старта.');return;}log(name,'undo',{undone:last.type});render();}function transfer(name,target){const a=state.athletes[name];if(a.status==='swim'){alert('Переводите пловца между отрезками, после финиша.');return;}if(target===a.group)return;const old=a.group;state.groups[old].members=state.groups[old].members.filter(n=>n!==name);state.groups[target].members.push(name);a.group=target;const completed=a.results.filter(r=>r.status==='finished').reduce((sum,r)=>sum+r.distance,0);const targetG=state.groups[target];a.number=Math.floor(completed/targetG.distance)+1;a.status=a.number>targetG.count?'done':(a.restStart?'rest':'idle');a.history.push({type:'transfer',at:Date.now(),from:old,to:target});log(name,'transfer',{from:old,to:target});modal=null;render();}function resultHTML(a){const last=[...a.results].reverse().find(r=>r.status==='finished');if(!last)return 'Нет результатов';const prev=[...a.results].reverse().filter(r=>r.status==='finished')[1];const diff=prev?` · ${((last.duration-prev.duration)/1000)>0?'+':''}${((last.duration-prev.duration)/1000).toFixed(1)} с`:'';return `${last.number}-й: ${clock(last.duration)}${diff}`;}function athleteHTML(name,now){const a=state.athletes[name],g=state.groups[a.group];let cls=a.status,tm='—',status='',button='';if(a.status==='swim'){tm=clock(now-a.start);status=`Плывёт · ${a.number}/${g.count}`;button=`Финиш ${a.number}/${g.count}`;}else if(a.status==='rest'){const remaining=g.rest-Math.floor((now-a.restStart)/1000);cls=remaining<0?'over':'rest';tm=restClock(remaining);status=remaining<0?`Отдых превышен · ${a.number-1}/${g.count}`:`Отдыхает · ${a.number-1}/${g.count}`;button=`Старт ${a.number}/${g.count}`;}else if(a.status==='done'){status='Серия завершена';button='Готово';}else{status=`Ожидает · ${a.number}/${g.count}`;button=`Старт ${a.number}/${g.count}`;}return `<div class="athlete ${cls}" data-athlete="${escapeHtml(name)}"><div><div class="name">${escapeHtml(name)}</div><div class="state">${status}</div><div class="last" data-history="${escapeHtml(name)}">◷ ${resultHTML(a)} ›</div><div class="miniActions"><button class="smallButton warn" data-skip="${escapeHtml(name)}" ${a.status==='swim'||a.status==='done'?'disabled':''}>Пропуск</button><button class="smallButton" data-transfer="${escapeHtml(name)}">Перевести</button><button class="smallButton" data-undo="${escapeHtml(name)}">↶</button></div></div><div class="clock" data-clock="${escapeHtml(name)}">${tm}</div><button class="action" data-act="${escapeHtml(name)}" ${a.status==='done'?'disabled':''}>${button.replace(' ','<br>')}</button></div>`;}
function render(){const now=Date.now(),g=state.groups[state.group];$('root').innerHTML=`<div class="app"><div class="top"><button class="btnIcon" id="resetBtn" title="Новая тренировка">↺</button><h1>Тренировка</h1><div class="right"><button class="btnIcon" id="resultsBtn" title="Результаты">▥</button><button class="btnIcon" id="settingsBtn" title="Настройки">⚙</button></div></div><div class="overview"><div class="meta"><span>♒ Бассейн 50 м</span><span>${Object.keys(state.athletes).length} пловцов</span></div><h2>Основная серия</h2><div class="summary">${groupNames.map(k=>{let x=state.groups[k];return `<div data-config="${k}"><b><i class="dot" style="background:${k==='fast'?'#19cf78':k==='medium'?'#208eff':'#9a5bff'}"></i>${x.name}</b><small>${x.count} × ${x.distance} м</small><small>Отдых: ${x.rest} с</small></div>`}).join('')}</div></div><div class="tabs">${groupNames.map(k=>`<button data-group="${k}" class="${state.group===k?'active':''}">${state.groups[k].name} · ${state.groups[k].members.length}</button>`).join('')}</div><div class="section"><strong>${g.count} × ${g.distance} м</strong><span>Отдых: ${g.rest} с</span></div><div class="athletes">${g.members.map(n=>athleteHTML(n,now)).join('')}</div><div class="footer">Нажмите на последний результат для истории пловца. «Пропуск» и «Перевести» доступны под именем. Все действия сохраняются на этом устройстве.</div></div>${modal?modalHTML():''}`;wire();}function modalHTML(){if(modal.type==='results'){const all=Object.entries(state.athletes);return `<div class="modalBackdrop"><div class="sheet"><h2>Результаты тренировки</h2><div class="notice">Данные сохраняются на устройстве. Таймеры продолжают идти, пока открыт этот экран.</div>${groupNames.map(k=>`<h3>${state.groups[k].name}</h3><table class="resultsTable"><tr><th>Пловец</th><th>Отрезков</th><th>Лучшее</th></tr>${all.filter(([n,a])=>a.group===k).map(([n,a])=>{const done=a.results.filter(r=>r.status==='finished');return `<tr><td>${escapeHtml(n)}</td><td>${done.length}/${state.groups[k].count}</td><td>${done.length?clock(Math.min(...done.map(r=>r.duration))):'—'}</td></tr>`}).join('')}</table>`).join('')}<div class="buttons"><button class="secondary" id="exportBtn">Экспорт CSV</button><button class="primary" data-close>Закрыть</button></div></div></div>`;}if(modal.type==='history'){const a=state.athletes[modal.name];return `<div class="modalBackdrop"><div class="sheet"><h2>${escapeHtml(modal.name)} · результаты</h2><table class="resultsTable"><tr><th>№</th><th>Дистанция</th><th>Время</th></tr>${a.results.map(r=>`<tr><td>${r.number}</td><td>${r.distance} м</td><td>${r.status==='skipped'?'Пропуск':clock(r.duration)}</td></tr>`).join('')||'<tr><td colspan="3">Пока нет результатов</td></tr>'}</table><div class="buttons"><button class="primary" data-close>Закрыть</button></div></div></div>`;}if(modal.type==='transfer'){const a=state.athletes[modal.name];return `<div class="modalBackdrop"><div class="sheet"><h2>Перевести: ${escapeHtml(modal.name)}</h2><div class="notice">Выполненные результаты сохраняются. Для будущих отрезков применяется программа новой подгруппы. Перевод возможен только между отрезками.</div><label>Новая подгруппа</label><select id="targetGroup">${groupNames.filter(k=>k!==a.group).map(k=>`<option value="${k}">${state.groups[k].name}</option>`).join('')}</select><div class="buttons"><button class="secondary" data-close>Отмена</button><button class="primary" id="transferConfirm">Перевести</button></div></div></div>`;}if(modal.type==='config'){const g=state.groups[modal.key];return `<div class="modalBackdrop"><div class="sheet"><h2>Упражнение: ${g.name}</h2><div class="notice">По отрезкам. Изменения действуют на следующие старты. Для уже завершённых отрезков данные не меняются.</div><label>Количество отрезков</label><input id="configCount" type="number" min="1" max="99" value="${g.count}"><label>Дистанция отрезка, м</label><input id="configDistance" type="number" min="25" max="5000" step="25" value="${g.distance}"><label>Отдых, секунд</label><input id="configRest" type="number" min="0" max="600" value="${g.rest}"><div class="buttons"><button class="secondary" data-close>Отмена</button><button class="primary" id="configSave">Сохранить</button></div></div></div>`;}return `<div class="modalBackdrop"><div class="sheet"><h2>Настройки</h2><div class="notice">MVP 0.1. Работает без сервера. Не удаляйте данные браузера до экспорта результатов.</div><div class="buttons"><button class="primary" data-close>Закрыть</button></div></div></div>`;}
function wire(){document.querySelectorAll('[data-group]').forEach(el=>el.onclick=()=>{state.group=el.dataset.group;save();render()});document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>act(el.dataset.act));document.querySelectorAll('[data-skip]').forEach(el=>el.onclick=()=>skip(el.dataset.skip));document.querySelectorAll('[data-undo]').forEach(el=>el.onclick=()=>undo(el.dataset.undo));document.querySelectorAll('[data-transfer]').forEach(el=>el.onclick=()=>{modal={type:'transfer',name:el.dataset.transfer};render()});document.querySelectorAll('[data-history]').forEach(el=>el.onclick=()=>{modal={type:'history',name:el.dataset.history};render()});document.querySelectorAll('[data-config]').forEach(el=>el.onclick=()=>{modal={type:'config',key:el.dataset.config};render()});document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>{modal=null;render()});$('resultsBtn').onclick=()=>{modal={type:'results'};render()};$('settingsBtn').onclick=()=>{modal={type:'settings'};render()};$('resetBtn').onclick=()=>{if(confirm('Начать новую тренировку? Текущие результаты будут удалены с устройства. Сначала экспортируйте их, если они нужны.')){state=seed();save();render()}};if($('configSave'))$('configSave').onclick=()=>{const g=state.groups[modal.key],c=Number($('configCount').value),d=Number($('configDistance').value),r=Number($('configRest').value);if(!Number.isInteger(c)||c<1||c>99||!Number.isInteger(d)||d<25||d>5000||!Number.isInteger(r)||r<0||r>600){alert('Проверьте значения');return;}Object.assign(g,{count:c,distance:d,rest:r});log('','config',{group:modal.key});modal=null;render()};if($('transferConfirm'))$('transferConfirm').onclick=()=>transfer(modal.name,$('targetGroup').value);if($('exportBtn'))$('exportBtn').onclick=exportCSV;}
function exportCSV(){const rows=[['Пловец','Подгруппа','Отрезок','Дистанция м','Статус','Время сек','Время события']];for(const [n,a] of Object.entries(state.athletes))for(const r of a.results)rows.push([n,state.groups[r.group]?.name||r.group,r.number,r.distance,r.status,r.status==='finished'?(r.duration/1000).toFixed(2):'',new Date(r.at).toISOString()]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='swim_results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function tick(){if(modal)return;for(const el of document.querySelectorAll('[data-clock]')){const a=state.athletes[el.dataset.clock];if(!a)continue;if(a.status==='swim')el.textContent=clock(Date.now()-a.start);else if(a.status==='rest'){const remaining=state.groups[a.group].rest-Math.floor((Date.now()-a.restStart)/1000);const next=remaining<0?'over':'rest';el.textContent=restClock(remaining);if(!el.closest('.athlete').classList.contains(next)){render();break;}}}}render();setInterval(tick,100);
</script></body></html>
