<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081727"><title>Swim Coach v0.5 Compact</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark;color:#fff;background:#081727}*{box-sizing:border-box}body{margin:0;background:#081727}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:700px;margin:auto;padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 8px);min-height:100dvh}.timerPage{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:65px;flex-shrink:0}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{font-size:29px}.brandTitle{font-size:clamp(20px,5.6vw,27px);font-weight:800}.subtitle{font-size:12px;color:#afc2d4}.headActions{display:flex;gap:7px}.headBtn{background:#1b3952;border:1px solid #3a5871;color:white;border-radius:13px;padding:10px;font-size:14px;font-weight:650}.headBtn.iconBtn{font-size:21px;min-width:42px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px;min-height:0;flex:1;align-content:start}.tile{min-width:0;min-height:0;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:5px 2px;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;position:relative}.tile.ready{background:linear-gradient(145deg,#294762,#16314c);border:1px solid #375d7c}.tile.swim{background:linear-gradient(145deg,#086d50,#034832);border:1px solid #0a7d5a}.tile.rest{background:linear-gradient(145deg,#84601d,#513a13);border:1px solid #987024}.tileName{font-weight:780;font-size:clamp(11px,3.3vw,16px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}.tileTime{font-weight:740;font-size:clamp(14px,4.2vw,23px);letter-spacing:-.65px;font-variant-numeric:tabular-nums;white-space:nowrap}.play{display:grid;place-items:center;background:#f3f6f8;border:0;border-radius:50%;width:clamp(29px,9vw,43px);height:clamp(29px,9vw,43px);padding:9px;flex-shrink:0}.play.stop{background:#f02e37}.play svg{width:100%;height:100%}.footer{display:flex;gap:7px;margin-top:9px;flex-shrink:0;min-height:50px}.footer button{border:1px solid #42617c;border-radius:14px;background:#193852;color:white;padding:8px 10px;font-weight:700}.footer .results{flex:1;font-size:17px}.footer .new{font-size:13px}.footer .more{font-size:22px}.panel{background:#163149;border:1px solid #34536d;border-radius:16px;padding:14px;margin:12px 0}.pageTitle{font-size:25px;font-weight:800}.row{display:flex;align-items:center;gap:9px}.field{min-width:0;flex:1;background:#19354d;color:white;border:1px solid #53718a;border-radius:11px;padding:12px}.primary{background:#078e70;border:0;color:white;border-radius:12px;padding:13px;font-weight:750}.muted{background:#27445e;color:white;border:1px solid #48657d;border-radius:12px;padding:12px;font-weight:650}.attendance{display:flex;align-items:center;gap:12px;background:#17334a;padding:13px;border-radius:12px;margin:7px 0;font-size:19px}.attendance input{width:22px;height:22px;accent-color:#19c49a}.attendance.checked{background:#174c47}.bottom{width:100%;margin-top:14px}.hint{color:#b3c6d5;font-size:13px;line-height:1.5;margin:12px 0}.person{display:flex;align-items:center;gap:7px;background:#17344c;border-radius:12px;padding:10px;margin:7px 0}.person .nm{flex:1;font-weight:700;font-size:19px}.person button{border:0;border-radius:10px;background:#31516b;color:white;padding:8px}.resultCard{background:#17334b;border:1px solid #36556c;border-radius:15px;margin:9px 0;overflow:hidden}.resultTop{display:flex;align-items:center;gap:9px;padding:14px;cursor:pointer}.resultTop .left{flex:1}.resultTop .nm{font-size:21px;font-weight:750}.marks{color:#bbd0df;font-size:14px;margin-top:5px}.counts{text-align:right;font-size:13px}.counts small{display:block;color:#b7cbd9;margin-top:4px}.details{padding:8px 15px 14px;border-top:1px solid #426078}.splitRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #3a5268;font-variant-numeric:tabular-nums}.skiprow{color:#ffd17b}.overlay{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(100%,360px);background:#1b354d;border:1px solid #50708a;border-radius:20px;padding:20px;box-shadow:0 20px 60px #000a}.dialog h2{margin:0 0 9px}.dialog p{color:#c4d4df;line-height:1.45}.dialogButtons{display:flex;gap:9px;margin-top:18px}.dialogButtons button{flex:1}.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);z-index:30;background:#e6f3ff;color:#10243b;padding:12px 15px;border-radius:12px;font-weight:700;white-space:nowrap}.empty{padding:25px;color:#b9cbd8;text-align:center}@media(max-height:690px){.header{min-height:50px}.footer{min-height:43px}.tile{border-radius:11px}.play{width:clamp(26px,7vh,38px);height:clamp(26px,7vh,38px);padding:8px}}@media(max-width:370px){.grid{gap:4px}.tileTime{font-size:clamp(13px,4vw,18px)}.tileName{font-size:11px}.footer .results{font-size:15px}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{'use strict';const KEY='swim-coach-v02',DEFAULT=['Анаят','Алена','Эмиль','Алексей','Сергей','Рустам','Николай','Аблай','Марат','Айнура Б.','Дина','Арман','Айнура К.','Татьяна','Асель','Ляззат','Камила','Елена','Марина'];let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state||!Array.isArray(state.people))state={people:DEFAULT.map((name,i)=>({id:'p'+i,name,events:[],mode:'ready',startedAt:null,restAt:null})),createdAt:Date.now()};state.people=state.people.map(p=>({...p,events:Array.isArray(p.events)?p.events:[],mode:p.mode||'ready'}));if(!state.roster19Applied){const old=state.people,used=new Set();state.people=[...DEFAULT.map((name,i)=>{const p=old.find(x=>x.name===name&&!used.has(x.id));if(p){used.add(p.id);return p}return{id:'roster19-'+i,name,events:[],mode:'ready',startedAt:null,restAt:null}}),...old.filter(p=>!used.has(p.id))];state.roster19Applied=true}if(!Array.isArray(state.attending)){state.attending=state.people.filter(p=>p.events.length||p.mode==='swim'||p.mode==='rest').map(p=>p.id);state.attendanceChosen=false}state.attending=state.attending.filter(id=>state.people.some(p=>p.id===id));let page=state.attendanceChosen?'timer':'attendance',expanded=null,toastTimer,dialogId=null;const app=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Не удалось сохранить данные')}}function notify(s){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2300)}const fmt=ms=>{const d=Math.floor(Math.max(0,ms||0)/100),m=Math.floor(d/600),s=Math.floor(d%600/10);return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d%10}`},marks=p=>p.events.map((e,i)=>e.type==='skip'?'–':String(i+1)),lastFinish=p=>[...p.events].reverse().find(e=>e.type==='finish'),svg=t=>t==='stop'?'<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="9" width="30" height="30" rx="3" fill="white"/></svg>':'<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 6L41 24 12 42Z" fill="#142334"/></svg>';function nav(){app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()})}function render(){app.className='app'+(page==='timer'?' timerPage':'');if(page==='timer')renderTimer();else if(page==='attendance')renderAttendance();else if(page==='people')renderPeople();else renderResults()}
function card(p){const swim=p.mode==='swim',rest=p.mode==='rest',time=swim?fmt(Date.now()-(p.startedAt||Date.now())):rest&&lastFinish(p)?fmt(lastFinish(p).duration):'00:00.0';return`<div class="tile ${esc(p.mode)}" data-tile="${esc(p.id)}" aria-label="${esc(p.name)}"><div class="tileName">${esc(p.name)}</div><div class="tileTime" data-clock="${esc(p.id)}">${time}</div><button class="play ${swim?'stop':''}" data-toggle="${esc(p.id)}" aria-label="${swim?'Финиш':'Старт'}: ${esc(p.name)}">${svg(swim?'stop':'play')}</button></div>`}function renderTimer(){const active=state.people.filter(p=>state.attending.includes(p.id));app.innerHTML=`<div class="header"><div class="brand"><span class="logo">🏊</span><div><div class="brandTitle">Swim Coach</div><div class="subtitle">Тренировка · ${active.length} пловцов</div></div></div><div class="headActions"><button class="headBtn iconBtn" data-nav="attendance" title="Участники" aria-label="Участники">♙</button><button class="headBtn iconBtn" data-nav="people" title="Список" aria-label="Список пловцов">⚙</button></div></div><div class="grid" id="grid" style="grid-template-rows:repeat(${Math.max(3,Math.ceil(active.length/4))},minmax(0,1fr))">${active.map(card).join('')}</div>${active.length?'':'<div class="empty">Выберите участников</div>'}<div class="footer"><button class="new" id="new">↻ Новый заплыв</button><button class="results" data-nav="results">▥ Результаты</button><button class="more" id="more" aria-label="Дополнительные действия">•••</button></div>`;nav();app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.toggle)});app.querySelector('#new').onclick=newWorkout;app.querySelector('#more').onclick=()=>showMenu();installLongPress()}
function toggle(id){const p=state.people.find(x=>x.id===id);if(!p)return;const now=Date.now();if(p.mode==='swim'){p.events.push({type:'finish',duration:Math.max(0,now-(p.startedAt||now)),startedAt:p.startedAt,at:now,restBefore:p.restAt==null?null:Math.max(0,(p.startedAt||now)-p.restAt)});p.mode='rest';p.restAt=now;p.startedAt=null}else{p.mode='swim';p.startedAt=now}save();renderTimer()}
function installLongPress(){app.querySelectorAll('[data-tile]').forEach(el=>{let timer=null,startX=0,startY=0,done=false;const cancel=()=>{clearTimeout(timer);timer=null};el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;startX=e.clientX;startY=e.clientY;done=false;cancel();timer=setTimeout(()=>{done=true;timer=null;showSkip(el.dataset.tile)},600)});el.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)cancel()});['pointerup','pointercancel','pointerleave'].forEach(type=>el.addEventListener(type,cancel));el.addEventListener('contextmenu',e=>e.preventDefault());el.querySelector('button').addEventListener('click',e=>{if(done){e.preventDefault();e.stopImmediatePropagation();done=false}},true)})}
function showSkip(id){const p=state.people.find(x=>x.id===id);if(!p)return;if(p.mode==='swim'){notify('Сначала завершите текущий отрезок');return}dialogId=id;const wrap=document.createElement('div');wrap.className='overlay';wrap.id='skipOverlay';wrap.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="skipTitle"><h2 id="skipTitle">${esc(p.name)}</h2><p>Пропустить следующий отрезок? Пропуск появится в результатах как «–».</p><div class="dialogButtons"><button class="muted" id="cancelSkip">Отмена</button><button class="primary" id="confirmSkip">Пропустить</button></div></div>`;document.body.append(wrap);wrap.querySelector('#cancelSkip').onclick=()=>wrap.remove();wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});wrap.querySelector('#confirmSkip').onclick=()=>{if(p.mode==='swim'){wrap.remove();return notify('Сначала завершите отрезок')}p.events.push({type:'skip',at:Date.now()});save();wrap.remove();renderTimer();notify('Пропуск записан')}}function showMenu(){const wrap=document.createElement('div');wrap.className='overlay';wrap.innerHTML='<div class="dialog"><h2>Действия</h2><div class="dialogButtons"><button class="muted" id="cancel">Закрыть</button><button class="primary" id="att">Участники</button></div></div>';document.body.append(wrap);wrap.querySelector('#cancel').onclick=()=>wrap.remove();wrap.querySelector('#att').onclick=()=>{wrap.remove();page='attendance';render()}}
function renderAttendance(){app.innerHTML=`<div class="header"><div class="pageTitle">Кто сегодня плавает?</div><button class="headBtn" data-nav="people">Список</button></div><div class="panel"><b>Участники тренировки</b><div class="hint">Выберите до 24 пловцов. Порядок соответствует списку.</div><div class="row"><span id="attCount" style="flex:1"></span><button class="muted" id="all">Все</button><button class="muted" id="none">Снять</button></div></div>${state.people.map(p=>`<label class="attendance"><input type="checkbox" data-att="${esc(p.id)}"><span>${esc(p.name)}</span></label>`).join('')}<button class="primary bottom" id="go">✓ К секундомеру</button>`;nav();const refresh=()=>{app.querySelector('#attCount').textContent=`${state.attending.length} из 24`;app.querySelectorAll('[data-att]').forEach(el=>{el.checked=state.attending.includes(el.dataset.att);el.closest('label').classList.toggle('checked',el.checked)})};app.querySelectorAll('[data-att]').forEach(el=>el.onchange=()=>{if(el.checked){if(state.attending.length>=24){el.checked=false;return notify('Максимум 24 пловца')}state.attending.push(el.dataset.att)}else state.attending=state.attending.filter(id=>id!==el.dataset.att);save();refresh()});app.querySelector('#all').onclick=()=>{state.attending=state.people.slice(0,24).map(p=>p.id);save();refresh()};app.querySelector('#none').onclick=()=>{state.attending=[];save();refresh()};app.querySelector('#go').onclick=()=>{if(!state.attending.length)return notify('Выберите хотя бы одного пловца');state.attendanceChosen=true;page='timer';save();render()};refresh()}
function renderPeople(){app.innerHTML=`<div class="header"><button class="headBtn" data-nav="attendance">‹ Назад</button><div class="pageTitle">Список пловцов</div></div><div class="row"><input class="field" id="newPerson" placeholder="Имя пловца" maxlength="48"><button class="primary" id="add">+ Добавить</button></div><div class="hint">Порядок здесь определяет расположение карточек. Перетаскивания нет.</div>${state.people.map(p=>`<div class="person"><span class="nm">${esc(p.name)}</span><button data-edit="${esc(p.id)}">✎</button><button data-delete="${esc(p.id)}">×</button></div>`).join('')}<button class="primary bottom" id="done">✓ Готово</button>`;nav();const inp=app.querySelector('#newPerson'),add=()=>{const name=inp.value.trim();if(!name)return;state.people.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6),name,events:[],mode:'ready',startedAt:null,restAt:null});save();renderPeople()};app.querySelector('#add').onclick=add;inp.onkeydown=e=>{if(e.key==='Enter')add()};app.querySelector('#done').onclick=()=>{page='attendance';render()};app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=state.people.find(x=>x.id===b.dataset.edit),s=prompt('Имя пловца',p.name);if(s!==null&&s.trim()){p.name=s.trim();save();renderPeople()}});app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const p=state.people.find(x=>x.id===b.dataset.delete);if(!confirm(`Удалить ${p.name}${p.events.length?' вместе с результатами':''}?`))return;state.people=state.people.filter(x=>x.id!==p.id);state.attending=state.attending.filter(id=>id!==p.id);save();renderPeople()})}
function renderResults(){const visible=state.people.filter(p=>p.events.length);app.innerHTML=`<div class="header"><button class="headBtn" data-nav="timer">‹ Назад</button><div class="pageTitle">Результаты</div><button class="headBtn" id="export">⇧ CSV</button></div><div class="panel">${new Date(state.createdAt).toLocaleDateString('ru-RU')} · ${visible.length} пловцов с результатами</div>${visible.length?'':'<div class="empty">Результатов пока нет</div>'}${visible.map(p=>`<div class="resultCard"><div class="resultTop" data-expand="${esc(p.id)}"><div class="left"><div class="nm">${esc(p.name)}</div><div class="marks">${esc(marks(p).join(', '))}</div></div><div class="counts"><b>${p.events.filter(e=>e.type==='finish').length} отр.</b><small>${p.events.filter(e=>e.type==='skip').length} пропусков</small></div><span>${expanded===p.id?'⌃':'⌄'}</span></div>${expanded===p.id?`<div class="details">${p.events.map((e,i)=>`<div class="splitRow ${e.type==='skip'?'skiprow':''}"><span>№ ${i+1}</span><b>${e.type==='skip'?'Пропуск':fmt(e.duration)}</b></div>`).join('')}</div>`:''}</div>`).join('')}`;nav();app.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{expanded=expanded===el.dataset.expand?null:el.dataset.expand;renderResults()});app.querySelector('#export').onclick=exportCSV}
function exportCSV(){const rows=[['Пловец','Отрезок','Тип','Время (сек)','Время','Отдых перед стартом (сек)']];state.people.forEach(p=>p.events.forEach((e,i)=>rows.push([p.name,i+1,e.type==='skip'?'Пропуск':'Финиш',e.type==='finish'?(e.duration/1000).toFixed(1):'',e.type==='finish'?fmt(e.duration):'',e.restBefore==null?'':(e.restBefore/1000).toFixed(1)])));const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='swim-results-'+new Date(state.createdAt).toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function newWorkout(){if(!confirm('Начать новую тренировку? Текущие результаты будут очищены. Сначала экспортируйте результаты, если они нужны.'))return;state.people.forEach(p=>{p.events=[];p.mode='ready';p.startedAt=null;p.restAt=null});state.createdAt=Date.now();state.attending=[];state.attendanceChosen=false;page='attendance';save();render()}
function tick(){if(page!=='timer'||document.hidden)return;const now=Date.now();state.people.forEach(p=>{if(p.mode!=='swim')return;const c=app.querySelector(`[data-clock="${CSS.escape(p.id)}"]`);if(c)c.textContent=fmt(now-(p.startedAt||now))})}setInterval(tick,100);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});save();render();
})();
</script></body></html>
